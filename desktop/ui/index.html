<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>pacer</title>
  <link rel="stylesheet" href="shell.css">
  <script src="shell.js" defer></script>
</head>
<body>
  <main>
    <img src="mark.svg" alt="pacer" width="48" height="48">
    <h1>Connecting to pacer…</h1>
    <p id="message" role="status" aria-live="polite">Looking for your local service.</p>
    <p id="elapsed" hidden></p>
    <section id="command-section" hidden>
      <label for="command">Select and copy command</label>
      <input id="command" readonly>
    </section>
    <p class="actions">
      <a class="button" id="start" href="/start" hidden>Start pacer</a>
      <a class="button" id="install" href="/install" hidden>Install</a>
      <a class="button" id="restart" href="/restart" hidden>Restart pacer</a>
      <a id="retry" href="/retry" hidden>Try again</a>
    </p>
    <p id="error" role="status" hidden></p>
    <p><a id="docs" href="https://github.com/lamtuanvu/pacer/blob/main/docs/install.md" hidden>Installation instructions</a></p>
  </main>
</body>
</html>
