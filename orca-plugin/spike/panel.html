<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>pacer spike</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 16px; background: var(--background); color: var(--foreground); }
    button { padding: 8px 12px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>pacer spike</h1>
  <p id="stamp">STAMP</p>
  <button id="hello" type="button">Show notification</button>
  <p id="result" role="status"></p>
  <script>
    let pendingId = null;
    document.getElementById("hello").addEventListener("click", () => {
      pendingId = `spike-${Date.now()}`;
      window.parent.postMessage({
        type: "orca-panel-action",
        requestId: pendingId,
        action: "notifications.show",
        params: { title: "pacer spike", body: "Hello from the spike panel." }
      }, "*");
    });
    window.addEventListener("message", (event) => {
      if (event.source !== window.parent) return;
      const message = event.data;
      if (!message || message.type !== "orca-panel-action-result" || message.requestId !== pendingId) return;
      document.getElementById("result").textContent = message.ok
        ? "Notification accepted."
        : `Notification failed: ${message.errorCode ?? ""} ${message.error ?? ""}`;
      pendingId = null;
    });
  </script>
</body>
</html>
