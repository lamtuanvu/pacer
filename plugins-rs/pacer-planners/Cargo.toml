[package]
name = "pacer-bundled-planners"
version = "0.0.0"
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
pacer-plugin = { path = "../../crates/plugin-sdk", features = ["install"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
regex = "1"
toml = "0.8"

[dev-dependencies]
pacer-plugin = { path = "../../crates/plugin-sdk", features = ["install", "testing"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }

[lints]
workspace = true
