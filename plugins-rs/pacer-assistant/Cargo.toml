[package]
name = "pacer-bundled-assistant"
version = "0.0.0"
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
pacer-plugin = { path = "../../crates/plugin-sdk" }
# Spec decision: same reqwest build as crates/assistant-pacer (reqwest rustls + json).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
pacer-plugin = { path = "../../crates/plugin-sdk", features = ["testing"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }

[lints]
workspace = true