[package]
name = "pacer-task-ops"
version = "0.0.0"
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
tokio.workspace = true
serde_json.workspace = true
pacer-foundation = { path = "../foundation", features = ["async"] }
pacer-js-json = { path = "../js-json" }
pacer-config = { path = "../config" }
pacer-config-ops = { path = "../config-ops" }
pacer-dispatch-ops = { path = "../dispatch-ops" }
pacer-engine = { path = "../engine" }
pacer-repos = { path = "../repos" }
pacer-store = { path = "../store" }
pacer-lifecycle = { path = "../lifecycle" }
pacer-read-model = { path = "../read-model" }
pacer-sessions = { path = "../sessions" }
chrono-tz = { version = "0.10.4", default-features = false, features = ["std"] }
rand = "0.9"
sha2 = "0.10"

[dev-dependencies]
rusqlite = { version = "0.43", features = ["bundled"] }
tempfile = "3"

[lints]
workspace = true
