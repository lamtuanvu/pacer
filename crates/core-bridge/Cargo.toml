[package]
name = "pacer-core-bridge"
version = "0.0.0"
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
test-ops = []

[dependencies]
hex = "0.4"
rand = "0.9"
axum = { version = "0.8", features = ["ws"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
pacer-config-ops = { path = "../config-ops" }
pacer-foundation = { path = "../foundation" }
pacer-install = { path = "../install" }
pacer-messaging-ops = { path = "../messaging-ops" }
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
