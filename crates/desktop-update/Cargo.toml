[package]
name = "pacer-desktop-update"
version = "0.0.0"
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
pacer-foundation = { path = "../foundation", features = ["async"] }
pacer-desktop-admission = { path = "../desktop-admission" }
pacer-update = { path = "../update" }
pacer-js-json = { path = "../js-json" }
rusqlite = { version = "0.41", features = ["bundled"] }
