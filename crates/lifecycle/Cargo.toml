[package]
name = "pacer-lifecycle"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
pacer-store = { path = "../store" }
pacer-js-json = { path = "../js-json" }
pacer-foundation = { path = "../foundation" }
rusqlite = { version = "0.41", features = ["bundled"] }
ryu-js = "1"
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value", "float_roundtrip"] }
thiserror.workspace = true
regex = "1"
url = "2"
icu_collator = { version = "=2.4.0", features = ["unstable"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
