[package]
name = "pacer-lifecycle"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
pacer-store = { path = "../store" }
pacer-foundation = { path = "../foundation" }
pacer-repos = { path = "../repos" }
pacer-js-json = { path = "../js-json" }
rusqlite = { version = "0.41", features = ["bundled"] }
ryu-js = "1"
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value", "float_roundtrip"] }
thiserror.workspace = true
regex = "1"
url = "2"
icu_collator = { version = "=2.4.0", features = ["unstable"] }

[[bin]]
name = "task_diff_probe"
path = "src/bin/task_diff_probe.rs"

[[bin]]
name = "files_search_probe"
path = "src/bin/files_search_probe.rs"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
