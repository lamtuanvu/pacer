[package]
name = "pacer-plugin-runtime"
version = "0.1.0"
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
pacer-plugin-capabilities = { path = "../plugin-capabilities" }
pacer-plugin-execution = { path = "../plugin-execution" }
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
tokio.workspace = true
uuid = { version = "1", features = ["v4"] }
nix = { version = "0.31", features = ["dir", "fs", "signal", "process", "user"] }
regex = "1"
sha2 = "0.10"
unicode-normalization = "0.1"
pacer-store = { path = "../store" }

[lints]
workspace = true

[dev-dependencies]
rusqlite = { version = "0.41", features = ["bundled"] }
