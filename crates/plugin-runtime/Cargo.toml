[package]
name = "pacer-plugin-runtime"
version = "0.1.0"
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
pacer-bun-glob = { path = "../bun-glob" }
pacer-plugin-wire = { path = "../plugin-wire" }
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror.workspace = true
tokio.workspace = true
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
nix = { version = "0.31", features = ["dir", "fs", "signal", "process", "user"] }
libc = "0.2"
url = "2"
regex = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
sha2 = "0.10"
sha1 = "0.10"
unicode-normalization = "0.1"
pacer-store = { path = "../store" }
pacer-foundation = { path = "../foundation" }

[lints]
workspace = true
