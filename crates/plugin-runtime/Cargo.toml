[package]
name = "pacer-plugin-runtime"
version = "0.0.0"
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
pacer-plugin-capabilities = { path = "../plugin-capabilities" }
pacer-plugin-host = { path = "../plugin-host" }
getrandom = "0.4"
hmac = "0.13"
nix = { version = "0.31", features = ["fs", "user", "socket", "signal"] }
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2 = "0.10"
thiserror.workspace = true
tokio = { workspace = true }

[dev-dependencies]
pacer-store = { path = "../store" }
serde_json = { workspace = true, features = ["float_roundtrip"] }
tempfile = "3"
tokio = { workspace = true }

[lints]
workspace = true
