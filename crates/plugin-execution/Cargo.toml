[package]
name = "pacer-plugin-execution"
version = "0.1.0"
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
pacer-plugin-capabilities = { path = "../plugin-capabilities" }
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
tokio.workspace = true
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
nix = { version = "0.31", features = ["dir", "fs", "signal", "process", "user"] }
libc = "0.2"
url = "2"
regex = "1"
sha2 = "0.10"
sha1 = "0.10"
pacer-store = { path = "../store" }
pacer-foundation = { path = "../foundation" }

[lints]
workspace = true
