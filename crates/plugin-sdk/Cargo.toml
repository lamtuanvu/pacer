[package]
name = "pacer-plugin"
version = "0.6.0"
publish = true
description = "The Rust plugin SDK for pacer, implementing the @pacer/plugin wire contract."
readme = "README.md"
repository.workspace = true
keywords = ["pacer", "plugin", "sdk", "json-rpc"]
categories = ["development-tools"]
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
testing = []
install = ["dep:sha2", "dep:jiff", "dep:toml", "dep:icu_collator"]

[dependencies]
pacer-plugin-agent-session-protocol = { path = "../plugin-agent-session-protocol", version = "0.4.0" }
pacer-plugin-decision-protocol = { path = "../plugin-decision-protocol", version = "0.4.0" }
pacer-plugin-install-protocol = { path = "../plugin-install-protocol", version = "0.4.0" }
pacer-plugin-hosts-protocol = { path = "../plugin-hosts-protocol", version = "0.4.0" }
pacer-plugin-assistant-protocol = { path = "../plugin-assistant-protocol", version = "0.5.0" }
pacer-plugin-workflow-protocol = { path = "../plugin-workflow-protocol", version = "0.3.0" }
pacer-plugin-exec-protocol = { path = "../plugin-exec-protocol", version = "0.4.0" }
pacer-plugin-protocol = { path = "../plugin-protocol", version = "0.4.0" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
sha2 = { version = "0.10", optional = true }
jiff = { version = "0.2", optional = true }
toml = { version = "0.8", optional = true }
icu_collator = { version = "=2.4.0", features = ["unstable"], optional = true }

[lints]
workspace = true

[[test]]
name = "harness"
required-features = ["testing"]

[[test]]
name = "install_blocks"
required-features = ["install", "testing"]

[[test]]
name = "install_helpers"
required-features = ["install", "testing"]

[[test]]
name = "install_jsonc"
required-features = ["install", "testing"]

[[test]]
name = "install_hookjson"
required-features = ["install", "testing"]

[[test]]
name = "install_undo"
required-features = ["install", "testing"]
