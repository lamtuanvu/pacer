[package]
name = "pacer-plugin"
version = "0.2.0"
publish = true
description = "The Rust plugin SDK for pacer, implementing the @pacer/plugin wire contract."
readme = "README.md"
repository.workspace = true
keywords = ["pacer", "plugin", "sdk", "json-rpc"]
categories = ["development-tools"]
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
testing = []

[dependencies]
pacer-plugin-agent-protocol = { path = "../plugin-agent-protocol", version = "0.2.0" }
pacer-plugin-dispatch-protocol = { path = "../plugin-dispatch-protocol", version = "0.2.0" }
pacer-plugin-hosts-protocol = { path = "../plugin-hosts-protocol", version = "0.2.0" }
pacer-plugin-protocol = { path = "../plugin-protocol", version = "0.2.0" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["rt"] }

[lints]
workspace = true

[[test]]
name = "harness"
required-features = ["testing"]
