[package]
name = "pacer-plugin"
version = "0.1.0"
publish = true
description = "The Rust plugin SDK for pacer, implementing the @pacer/plugin wire contract."
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
testing = []

[dependencies]
pacer-plugin-protocol = { path = "../plugin-protocol" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["rt"] }

[lints]
workspace = true

[[test]]
name = "harness"
required-features = ["testing"]
