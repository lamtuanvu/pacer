[package]
name = "pacer-plugin"
version = "0.1.0"
publish = true
description = "The Rust plugin SDK for pacer, implementing the @pacer/plugin wire contract."
readme = "README.md"
repository.workspace = true
keywords = ["pacer", "plugin", "sdk", "json-rpc"]
categories = ["development-tools"]
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
testing = []

[dependencies]
pacer-plugin-agent-session-protocol = { path = "../plugin-agent-session-protocol", version = "0.1.0" }
pacer-plugin-decision-protocol = { path = "../plugin-decision-protocol", version = "0.1.0" }
pacer-plugin-protocol = { path = "../plugin-protocol", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["rt"] }

[lints]
workspace = true

[[test]]
name = "harness"
required-features = ["testing"]
