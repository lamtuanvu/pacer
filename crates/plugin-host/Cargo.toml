[package]
name = "pacer-plugin-host"
version = "0.2.0"
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
pacer-plugin-protocol = { path = "../plugin-protocol" }
pacer-foundation = { path = "../foundation" }
sha2 = "0.10"
ryu-js = "1"
serde.workspace = true
# Correct IEEE-754 rounding for JSON decimal/exponent inputs, like JSON.parse.
serde_json = { workspace = true, features = ["float_roundtrip"] }
semver = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
url = "2"
libc = "0.2"
nix = { version = "0.31", features = ["dir", "fs", "signal", "process", "user"] }
thiserror.workspace = true
tokio.workspace = true
unicode-normalization = "0.1.24"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
hmac = "0.12"
getrandom = "0.4"
sha1 = "0.10"
pacer-store = { path = "../store" }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
