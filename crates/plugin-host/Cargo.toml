[package]
name = "pacer-plugin-host"
version = "0.2.0"
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
testing = []

[dependencies]
pacer-plugin-protocol = { path = "../plugin-protocol" }
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
semver = "1"
uuid = { version = "1", features = ["v4"] }
url = "2"
libc = "0.2"
nix = { version = "0.31", features = ["dir", "fs", "signal", "process", "user"] }
thiserror.workspace = true
tokio.workspace = true
unicode-normalization = "0.1.24"
sha2 = "0.10"
hmac = "0.12"
getrandom = "0.4"
ryu-js = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
pacer-store = { path = "../store" }
pacer-js-json = { path = "../js-json" }

[lints]
workspace = true
