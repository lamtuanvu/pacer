[package]
name = "pacer-plugin-host"
version = "0.2.0"
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
pacer-plugin-protocol = { path = "../plugin-protocol" }
pacer-foundation = { path = "../foundation" }
pacer-config = { path = "../config" }
sha2 = "0.10"
hex = "0.4"
ryu-js = "1"
flate2 = "1"
ed25519-dalek = "2"
serde.workspace = true
# Correct IEEE-754 rounding for JSON decimal/exponent inputs, like JSON.parse.
serde_json = { workspace = true, features = ["float_roundtrip"] }
semver = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
url = "2"
libc = "0.2"
nix = { version = "0.31", features = ["dir", "fs", "user"] }
thiserror.workspace = true
tokio.workspace = true
unicode-normalization = "0.1.24"
icu_collator = { version = "=2.4.0", features = ["unstable"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
