[package]
name = "pacer-desktop-native"
version = "0.0.0"
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
pacer-foundation = { path = "../foundation", features = ["async"] }
pacer-js-json = { path = "../js-json" }
pacer-desktop-update = { path = "../desktop-update" }
serde_json.workspace = true
sha2 = "0.10"
hex = "0.4"
rand = "0.9"
tokio.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal"] }

[target.'cfg(target_os = "macos")'.dependencies]
nix = { version = "0.31", features = ["socket", "uio", "fs", "user", "signal", "process"] }
security-framework = "3.7"
core-foundation = "0.10"
libproc = "0.14"
socket2 = { version = "0.6", features = ["all"] }

[dev-dependencies]
tempfile = "3"
tokio.workspace = true

[lints]
workspace = true