[package]
name = "pacer-delegation"
version = "0.0.0"
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
pacer-foundation = { path = "../foundation", features = ["async"] }
pacer-store = { path = "../store" }
pacer-config = { path = "../config" }
pacer-repos = { path = "../repos" }
pacer-lifecycle = { path = "../lifecycle" }
pacer-dispatch = { path = "../dispatch" }
pacer-sessions = { path = "../sessions" }
pacer-plugin-host = { path = "../plugin-host" }
pacer-models = { path = "../models" }
pacer-js-json = { path = "../js-json" }
pacer-read-model = { path = "../read-model" }
serde_json.workspace = true
tokio.workspace = true
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { workspace = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
