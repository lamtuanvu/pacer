[package]
name = "pacer-read-model"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
icu_collator = { version = "=2.4.0", features = ["unstable"] }
pacer-foundation = { path = "../foundation" }
pacer-store = { path = "../store" }
pacer-config = { path = "../config" }
pacer-engine = { path = "../engine" }
serde_json.workspace = true
thiserror.workspace = true
rusqlite = { version = "0.41", features = ["bundled"] }
sha2 = "0.10"
regex = "1"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
chrono-tz = { version = "0.10.4", default-features = false, features = ["std"] }
ryu-js = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
