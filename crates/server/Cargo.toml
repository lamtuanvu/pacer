[package]
name = "pacer-server"
version = "0.0.0"
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
test-ops = []

[dependencies]
tokio.workspace = true
serde_json.workspace = true
serde.workspace = true
ryu-js = "1"
pacer-foundation = { path = "../foundation" }
pacer-plugin-ops = { path = "../plugin-ops" }
pacer-plugin-runtime = { path = "../plugin-runtime" }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
pacer-config = { path = "../config" }
pacer-engine = { path = "../engine" }
pacer-lifecycle = { path = "../lifecycle" }
pacer-store = { path = "../store" }
pacer-read-model = { path = "../read-model" }
pacer-task-ops = { path = "../task-ops" }
pacer-config-ops = { path = "../config-ops" }
pacer-messaging-ops = { path = "../messaging-ops" }
pacer-dispatch-ops = { path = "../dispatch-ops" }
pacer-assistant-ops = { path = "../assistant-ops" }
pacer-machine-ops = { path = "../machine-ops" }
pacer-discovery-ops = { path = "../discovery-ops" }
pacer-mdns = { path = "../mdns" }
chrono-tz = { version = "0.10.4", default-features = false, features = ["std"] }

axum = { version = "0.8", features = ["ws"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
tokio-tungstenite = "0.29"
futures-util = "0.3"
form_urlencoded = "1"
subtle = "2"
sha2 = "0.10"
hex = "0.4"
rand = "0.9"
base64 = "0.22"
icu_collator = { version = "=2.4.0", features = ["unstable"] }

[build-dependencies]
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal"] }

[target.'cfg(target_os = "macos")'.dependencies]
nix = { version = "0.31", features = ["socket", "uio", "fs", "user", "signal", "process"] }
security-framework = "3.7"
core-foundation = "0.10"
libproc = "0.14"
socket2 = { version = "0.6", features = ["all"] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
