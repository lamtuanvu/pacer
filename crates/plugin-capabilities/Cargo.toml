[package]
name = "pacer-plugin-capabilities"
version = "0.0.0"
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
pacer-plugin-host = { path = "../plugin-host" }
pacer-store = { path = "../store" }
pacer-foundation = { path = "../foundation" }
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
url = "2"
libc = "0.2"
nix = { version = "0.31", features = ["dir", "fs", "signal", "process", "user"] }
thiserror.workspace = true
tokio.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sha2 = "0.10"
sha1 = "0.11"

[dev-dependencies]
pacer-plugin-host = { path = "../plugin-host", features = ["testing"] }

[lints]
workspace = true
