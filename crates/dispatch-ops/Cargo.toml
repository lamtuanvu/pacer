[package]
name = "pacer-dispatch-ops"
version = "0.0.0"
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde_json.workspace = true
pacer-foundation = { path = "../foundation" }
pacer-config = { path = "../config" }
pacer-lifecycle = { path = "../lifecycle" }
pacer-store = { path = "../store" }
rusqlite = { version = "0.41", features = ["bundled"] }
icu_collator = { version = "=2.4.0", features = ["unstable"] }
ryu-js = "1"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal"] }

[dev-dependencies]
tempfile = "3"
tokio.workspace = true

[lints]
workspace = true
