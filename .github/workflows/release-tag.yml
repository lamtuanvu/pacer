name: Release tag
run-name: "${{ github.event_name == 'workflow_dispatch' && format('Recover release PR #{0}', inputs.pr) || github.event.head_commit.message }}"

# When a release PR from release-prepare.yml lands, tag its merge commit. The
# tag is pushed with RELEASE_TOKEN so it starts release.yml, which publishes.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr:
        description: Merged release PR number to validate and finish
        required: true
        type: string

permissions: {}

concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  tag:
    if: "github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'chore: release ')"
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: read
      actions: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      GH_READ_TOKEN: ${{ github.token }}
      SUBJECT: ${{ github.event.head_commit.message }}
    steps:
      - name: Resolve interrupted release
        if: github.event_name == 'workflow_dispatch'
        env:
          PR: ${{ inputs.pr }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$PR" in ''|*[!0-9]*) echo '::error::PR must be a number'; exit 1 ;; esac
          pr=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json state,baseRefName,headRefName,headRefOid,mergeCommit,title,isCrossRepository)
          printf '%s' "$pr" | jq -e '.state == "MERGED" and .baseRefName == "main" and .isCrossRepository == false' >/dev/null
          branch=$(printf '%s' "$pr" | jq -er .headRefName)
          version=${branch#release/v}
          printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          test "$branch" = "release/v$version"
          printf '%s' "$pr" | jq -e --arg title "chore: release $version" '.title == $title' >/dev/null
          {
            echo "RELEASE_COMMIT=$(printf '%s' "$pr" | jq -er .mergeCommit.oid)"
            echo "RECOVERY_BRANCH=$branch"
            echo "SUBJECT=chore: release $version (#$PR)"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_COMMIT || github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Validate interrupted release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PUSH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_PUSH_TOKEN"
          version=$(jq -r .version package.json)
          test "$RECOVERY_BRANCH" = "release/v$version"
          git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main
          test "$(git log -1 --format=%s)" = "$SUBJECT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo '::error::Tag already exists; rerun the failed Release publishing job instead'; exit 1
          fi
          # Validate the exact immutable merge commit, including commits that
          # reached main after the release PR branched.
          validation_branch="release/recovery-v${version}-${RELEASE_COMMIT:0:12}"
          remote=$(git ls-remote --heads origin "refs/heads/$validation_branch")
          if test -n "$remote"; then
            test "$(printf '%s' "$remote" | cut -f 1)" = "$RELEASE_COMMIT" \
              || { echo '::error::Recovery branch does not point to release merge commit'; exit 1; }
          else
            # Create only an absent branch; never overwrite another branch.
            auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$RELEASE_PUSH_TOKEN" | base64 | tr -d '\n')"
            git -c "http.extraheader=$auth" push --force-with-lease="refs/heads/$validation_branch:" origin "$RELEASE_COMMIT:refs/heads/$validation_branch"
          fi
          previous=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --limit 1 --json databaseId --jq '.[0].databaseId // 0')
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$validation_branch" -f version="$version" -f dry_run=true
          run=""
          for _ in $(seq 1 30); do
            run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --branch "$validation_branch" --commit "$RELEASE_COMMIT" --event workflow_dispatch --json databaseId --jq "[.[] | select(.databaseId > $previous)][0].databaseId // empty")
            test -n "$run" && break
            sleep 10
          done
          test -n "$run" || { echo '::error::Recovery dry run did not start'; exit 1; }
          gh run watch "$run" --repo "$GITHUB_REPOSITORY" --interval 30 --exit-status
          echo "RECOVERY_DRY_RUN_ID=$run" >> "$GITHUB_ENV"
      - name: Tag the release commit
        run: |
          set -eu
          release_sha=${RELEASE_COMMIT:-$GITHUB_SHA}
          test -n "$GH_TOKEN" || { echo "::error::Add a RELEASE_TOKEN secret (see CONTRIBUTING.md, Releasing)"; exit 1; }
          version=$(jq -r .version package.json)
          subject=$(printf '%s\n' "$SUBJECT" | head -n 1)
          # Squash merges append "(#123)"; anything else is not a release PR.
          printf '%s\n' "$subject" | grep -Eq "^chore: release ${version//./\\.}( \(#[0-9]+\))?$" \
            || { echo "Head commit '$subject' does not release package.json $version; nothing to tag"; exit 0; }
          # A manual merge must not bypass a failed or missing dry run.
          pr_number=$(printf '%s\n' "$subject" | sed -nE 's/.* \(#([0-9]+)\)$/\1/p')
          test -n "$pr_number" || { echo '::error::Release commit must identify its merged PR'; exit 1; }
          pr=$(GH_TOKEN="$GH_READ_TOKEN" gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json state,baseRefName,headRefName,headRefOid,mergeCommit)
          printf '%s' "$pr" | jq -e --arg sha "$release_sha" --arg branch "release/v$version" \
            '.state == "MERGED" and .baseRefName == "main" and .headRefName == $branch and .mergeCommit.oid == $sha' >/dev/null \
            || { echo '::error::Release PR does not match this merge commit'; exit 1; }
          head=$(printf '%s' "$pr" | jq -er .headRefOid)
          if test -n "${RECOVERY_DRY_RUN_ID:-}"; then
            run=$(GH_TOKEN="$GH_READ_TOKEN" gh run view "$RECOVERY_DRY_RUN_ID" --repo "$GITHUB_REPOSITORY" --json headSha,headBranch,event,status,conclusion)
            validation_branch="release/recovery-v${version}-${release_sha:0:12}"
            printf '%s' "$run" | jq -e --arg sha "$release_sha" --arg branch "$validation_branch" \
              '.headSha == $sha and .headBranch == $branch and .event == "workflow_dispatch" and .status == "completed" and .conclusion == "success"' >/dev/null \
              || { echo '::error::Recovery dry run did not pass on the exact release merge commit'; exit 1; }
          else
            # Automatic tagging still requires the PR head and merge trees to match.
            git cat-file -e "$head^{commit}" 2>/dev/null || git fetch --no-tags origin "refs/pull/$pr_number/head"
            git diff --quiet "$head^{tree}" "$release_sha^{tree}" \
              || { echo "::error::Merge tree differs from the tested release PR; run Release tag manually with PR $pr_number to validate the merge commit"; exit 1; }
            runs=$(GH_TOKEN="$GH_READ_TOKEN" gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml \
              --branch "release/v$version" --commit "$head" --limit 1 \
              --json headSha,status,conclusion)
            printf '%s' "$runs" | jq -e --arg head "$head" \
              'length > 0 and .[0].headSha == $head and .[0].status == "completed" and .[0].conclusion == "success"' >/dev/null \
              || { echo "::error::Latest release dry run for the PR head must pass before tagging. Run Release tag manually with PR $pr_number to validate and recover this release"; exit 1; }
          fi
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::$tag already exists; tags are never moved"; exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$tag" "$release_sha" -m "pacer $version"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -c "http.extraheader=$auth" push origin "refs/tags/$tag"
          echo "Tagged $tag at $release_sha; release.yml publishes it." >> "$GITHUB_STEP_SUMMARY"
