name: Prepare release

# One click: pin one commit, bump its version, tag it. The tag starts
# release.yml, which builds, checks CI's full suite and publishes from that
# tag alone, so later merges to main never affect the release. The version
# bump reaches main through a separate bookkeeping PR that the release does
# not wait for. Writes go through RELEASE_TOKEN so the tag and PR start
# workflows (GitHub does not run workflows for GITHUB_TOKEN pushes).
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (auto reads feat/fix/breaking commits since the last tag)
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      commit:
        description: Commit to release (default main's head when the run starts)
        type: string
        default: ''

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      BUMP: ${{ inputs.bump }}
      COMMIT: ${{ inputs.commit }}
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
    steps:
      - name: Require main and the release token
        run: |
          test "$GITHUB_REF" = refs/heads/main || { echo "::error::Run Prepare release from main"; exit 1; }
          test -n "$GH_TOKEN" || { echo "::error::Add a RELEASE_TOKEN secret (see CONTRIBUTING.md, Releasing)"; exit 1; }
      - name: Commit as the token's owner
        # One author keeps DCO sign-off and attribution consistent on the release commit and PR.
        run: |
          read -r login id name <<< "$(gh api user --jq '"\(.login) \(.id) \(.name // .login)"')"
          { echo "GIT_AUTHOR_NAME=$name"; echo "GIT_COMMITTER_NAME=$name"
            echo "GIT_AUTHOR_EMAIL=$id+$login@users.noreply.github.com"; echo "GIT_COMMITTER_EMAIL=$id+$login@users.noreply.github.com"; } >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Version selection and generated notes read commits since the last tag.
          fetch-tags: true
          persist-credentials: false
      - name: Pin the commit to release
        id: pin
        run: |
          set -euo pipefail
          git fetch origin main --tags
          target=$(git rev-parse --verify "${COMMIT:-origin/main}^{commit}")
          git merge-base --is-ancestor "$target" origin/main \
            || { echo "::error::$target is not on main"; exit 1; }
          git switch --detach "$target"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "Releasing commit $target" >> "$GITHUB_STEP_SUMMARY"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Pick the version
        id: version
        run: |
          set -euo pipefail
          current=$(jq -er .version package.json)
          # The newest stable tag anywhere, not just on this commit's history.
          latest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -v -- - | head -n 1 || true)
          # A commit that already carries an untagged version (its bump merged earlier) releases as is.
          if git rev-parse -q --verify "refs/tags/v$current" >/dev/null; then
            # A newer release whose bookkeeping PR hasn't reached main yet would be computed from an old base.
            test -z "$latest" || test "$latest" = "v$current" \
              || { echo "::error::$latest is newer than this commit's v$current; merge its chore: release PR into main first"; exit 1; }
            version=$(bun scripts/release/next-version.ts "$BUMP")
          else
            version=$current
          fi
          if test -n "$latest" && test "$(printf '%s\n%s\n' "${latest#v}" "$version" | sort -V | tail -n 1)" != "$version"; then
            echo "::error::v$version would sort below the newest release $latest"; exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version is already tagged; tags are never moved"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "bumped=$(test "$version" = "$current" && echo false || echo true)" >> "$GITHUB_OUTPUT"
      - name: Commit the version bump on the pinned commit
        if: steps.version.outputs.bumped == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          bun run release:prepare "$VERSION"
          git add -A
          git commit -s -m "chore: release $VERSION"
      - name: Tag and push
        id: tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          test "$(jq -er .version package.json)" = "$VERSION"
          grep -q "^## \[$VERSION\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no $VERSION section"; exit 1; }
          release=$(git rev-parse HEAD)
          git tag -a "v$VERSION" "$release" -m "pacer $VERSION"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          # The tag carries its own commit; main does not have to contain the bump.
          git -c "http.extraheader=$auth" push origin "refs/tags/v$VERSION"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "Tagged v$VERSION at $release; release.yml publishes it." >> "$GITHUB_STEP_SUMMARY"
      - name: Open the bookkeeping PR that brings the bump to main
        if: steps.version.outputs.bumped == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          branch="release/v$VERSION"
          release=$(git rev-parse HEAD)
          # Cut the branch from current main so it merges cleanly; the tag already holds the release.
          git fetch origin main
          git switch --detach origin/main
          section() { awk -v heading="## [$VERSION]" '/^## / { if (found) exit; if (index($0, heading) == 1) found=1 } found { print }'; }
          if ! git cherry-pick "$release"; then
            git cherry-pick --abort; git switch --detach "$release"
            echo "The bump conflicts with current main; resolve it on $branch." >> "$GITHUB_STEP_SUMMARY"
          elif test "$(section < CHANGELOG.md)" != "$(git show "$release:CHANGELOG.md" | section)"; then
            # A clean pick can file Unreleased entries merged after the pin under this version.
            git switch --detach "$release"
            echo "Main's Unreleased notes changed after the pin; move only the published entries on $branch." >> "$GITHUB_STEP_SUMMARY"
          fi
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -c "http.extraheader=$auth" push origin "HEAD:refs/heads/$branch"
          body=$(printf 'Brings the version bump of the published **v%s** tag to main. The release itself was built from the tag and does not wait for this PR.\n\nThe only UI-scoped changes are version strings, so no UI evidence manifest is needed.' "$VERSION")
          url=$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" --title "chore: release $VERSION" --body "$body")
          gh pr merge "$url" --repo "$GITHUB_REPOSITORY" --auto --squash || echo "Auto-merge unavailable; merge $url by hand." >> "$GITHUB_STEP_SUMMARY"
          echo "Bookkeeping PR: $url" >> "$GITHUB_STEP_SUMMARY"
