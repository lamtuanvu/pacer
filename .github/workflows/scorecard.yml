name: Scorecard

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '47 3 * * 1'
  branch_protection_rule:

# Scorecard publishing forbids workflow-level write permissions.
permissions:
  contents: read

jobs:
  analysis:
    name: Analyze supply chain security
    # Code scanning and Scorecard need a public repo on a free account.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
