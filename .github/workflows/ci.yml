name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '41 3 * * 1'

permissions:
  contents: read

concurrency:
  # Include commit SHA for PR events to prevent duplicate-run cancellation race.
  # Each (PR, commit) pair gets its own group; cancel-in-progress only for push to main.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'pull_request' && github.sha || '' }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  changes:
    name: Select affected checks
    runs-on: ubuntu-latest
    outputs:
      bun: ${{ steps.changes.outputs.bun }}
      full: ${{ steps.changes.outputs.full }}
      focused_tests: ${{ steps.changes.outputs.focused_tests }}
      rust: ${{ steps.changes.outputs.rust }}
      e2e: ${{ steps.changes.outputs.e2e }}
      ui: ${{ steps.changes.outputs.ui }}
      timings: ${{ steps.changes.outputs.timings }}
    steps:
      - name: Check out history for complete change detection
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select checks from changed paths
        id: changes
        run: python3 scripts/ci/changes.py

  release-readiness:
    name: Release readiness
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require the latest release dry run for this PR head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          if test "$EVENT" != pull_request; then exit 0; fi
          case "$BRANCH" in release/v*) ;; *) exit 0 ;; esac
          test "$HEAD_REPO" = "$REPO" || { echo '::error::Release PR must be in this repository'; exit 1; }
          for _ in $(seq 1 1400); do
            runs=$(gh run list --repo "$REPO" --workflow release.yml --branch "$BRANCH" --commit "$HEAD" --event pull_request --limit 1 --json status,conclusion,url)
            status=$(printf '%s' "$runs" | jq -r '.[0].status // "missing"')
            if test "$status" = completed; then
              printf '%s' "$runs" | jq -e '.[0].conclusion == "success"' >/dev/null \
                || { echo "::error::Release validation failed: $(printf '%s' "$runs" | jq -r '.[0].url')"; exit 1; }
              exit 0
            fi
            sleep 10
          done
          echo '::error::Timed out waiting for release validation of this PR head'
          exit 1

  ui-evidence:
    needs: changes
    if: ${{ needs.changes.outputs.ui == 'true' && github.event_name == 'pull_request' }}
    name: UI review readiness
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Merged PRs may have a deleted branch; retain the reviewed history.
          ref: ${{ github.event.pull_request.merged && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0 # UI evidence compares verified PR base/head SHAs.
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lockb') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check UI review evidence
        run: bun run ui:check --evidence-only

  test:
    name: Test (${{ matrix.os }}, shard ${{ matrix.shard }})
    needs: [changes, ui-evidence, release-readiness]
    # Run code validation even when manual review evidence is incomplete.
    if: ${{ always() }}
    # Keep required names, but do not allocate macOS for a docs-only gate or a PR;
    # PRs run logic tests on Linux and OS-specific checks run on main/schedule/dispatch.
    runs-on: ${{ needs.changes.outputs.bun == 'true' && (github.event_name != 'pull_request' || matrix.os == 'ubuntu-latest') && matrix.os || 'ubuntu-latest' }}
    env:
      RUN_CHECKS: ${{ needs.changes.outputs.bun == 'true' && (github.event_name != 'pull_request' || matrix.os == 'ubuntu-latest') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        shard: [0, 1, 2, 3]
    steps:
      - name: Check out repository
        if: ${{ env.RUN_CHECKS == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Merged PRs may have a deleted branch; retain the reviewed history.
          ref: ${{ github.event.pull_request.merged && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0 # UI evidence compares verified PR base/head SHAs.
      - name: Set up Bun
        if: ${{ env.RUN_CHECKS == 'true' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Cache Bun dependencies
        if: ${{ env.RUN_CHECKS == 'true' }}
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lockb') }}
          restore-keys: |
            bun-${{ runner.os }}-
      # The conformance suite builds the Rust fixture plugin.
      - name: Set up Rust
        if: ${{ env.RUN_CHECKS == 'true' && (needs.changes.outputs.rust == 'true' || needs.changes.outputs.full == 'true') }}
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.0
      - name: Cache Rust
        if: ${{ env.RUN_CHECKS == 'true' && needs.changes.outputs.full == 'true' }}
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install dependencies
        if: ${{ env.RUN_CHECKS == 'true' }}
        run: bun install --frozen-lockfile
      - name: Check UI policy
        if: ${{ env.RUN_CHECKS == 'true' }}
        run: bun run ui:check --source-only
      - name: Typecheck
        if: ${{ env.RUN_CHECKS == 'true' && needs.changes.outputs.full == 'true' }}
        run: bun run typecheck
      - name: Build the Rust fixture plugin
        if: ${{ env.RUN_CHECKS == 'true' && needs.changes.outputs.full == 'true' }}
        run: cargo build --locked -p pacer-fixtures --bin pacer-fixture
      - name: Build production and native dispatch test front doors
        if: ${{ env.RUN_CHECKS == 'true' && needs.changes.outputs.full == 'true' }}
        run: |
          cargo build --locked -p pacer
          cp target/debug/pacer "$RUNNER_TEMP/pacer-production"
          cargo build --locked -p pacer --features test-ops
          cp target/debug/pacer "$RUNNER_TEMP/pacer-native-test"
          bun -e 'import { compileCore } from "./scripts/release/build"; import { hostTarget } from "./src/update/manifest"; import { join } from "node:path"; import pkg from "./package.json"; const target = hostTarget(); if (!target) throw Error("Unsupported CI host"); await compileCore({ root: process.cwd(), target, version: pkg.version, outfile: join(process.env.RUNNER_TEMP!, "pacer-core") });'
          echo "PACER_TEST_FRONT_DOOR=$RUNNER_TEMP/pacer-production" >> "$GITHUB_ENV"
          echo "PACER_TEST_NATIVE_FRONT_DOOR=$RUNNER_TEMP/pacer-native-test" >> "$GITHUB_ENV"
          echo "PACER_TEST_REFERENCE_CORE=$RUNNER_TEMP/pacer-core" >> "$GITHUB_ENV"
      - name: Build the SQLite cross-runtime proof
        if: ${{ env.RUN_CHECKS == 'true' && needs.changes.outputs.full == 'true' }}
        run: cargo build --locked -p pacer-sqlite-proof --bin pacer-sqlite-proof
      - name: Build the task store parity probe
        if: ${{ env.RUN_CHECKS == 'true' && needs.changes.outputs.full == 'true' }}
        run: cargo build --locked -p pacer-store --bin task_store_probe
      - name: Install Linux test cross-build prerequisites
        if: ${{ env.RUN_CHECKS == 'true' && needs.changes.outputs.full == 'true' && runner.os == 'Linux' }}
        run: |
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
          python3 -m venv "$RUNNER_TEMP/pacer-cross"
          "$RUNNER_TEMP/pacer-cross/bin/pip" install --only-binary=:all: cargo-zigbuild==0.24.0 ziglang==0.14.1
          echo "$RUNNER_TEMP/pacer-cross/bin" >> "$GITHUB_PATH"
      # The frozen playwright-core dependency pins the matching Chromium revision. The full suite includes
      # browser tests, so install it whenever that suite runs, not only when the change selects e2e.
      - name: Install locked Chromium test browser
        if: ${{ env.RUN_CHECKS == 'true' && (needs.changes.outputs.e2e == 'true' || needs.changes.outputs.full == 'true') }}
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/pacer-playwright" >> "$GITHUB_ENV"
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/pacer-playwright" bun node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Test (full suite, sharded)
        if: ${{ env.RUN_CHECKS == 'true' && needs.changes.outputs.full == 'true' }}
        env:
          PACER_SQLITE_PROOF_BIN: ${{ github.workspace }}/target/debug/pacer-sqlite-proof
          PACER_STORE_PROBE_BIN: ${{ github.workspace }}/target/debug/task_store_probe
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: 4
        run: bun run test:sharded
      - name: Focused tests
        if: ${{ env.RUN_CHECKS == 'true' && needs.changes.outputs.full == 'false' && matrix.shard == 0 && matrix.os == 'ubuntu-latest' }}
        env:
          FOCUSED_TESTS: ${{ needs.changes.outputs.focused_tests }}
        run: python3 -c 'import json, os, subprocess; subprocess.run(["bun", "run", "test", "--jobs=4", *json.loads(os.environ["FOCUSED_TESTS"])], check=True)'
      - name: Build
        if: ${{ env.RUN_CHECKS == 'true' }}
        run: bun run build
      - name: Smoke test release artifact
        if: ${{ env.RUN_CHECKS == 'true' }}
        run: ./dist/pacer --version
      # These existing required checks must still reject incomplete evidence.
      - name: Require UI review readiness
        if: ${{ always() }}
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          UI_REQUIRED: ${{ needs.changes.outputs.ui == 'true' && github.event_name == 'pull_request' }}
          UI_EVIDENCE_RESULT: ${{ needs.ui-evidence.result }}
          RELEASE_READINESS_RESULT: ${{ needs.release-readiness.result }}
        run: |
          echo "UI review readiness: $UI_EVIDENCE_RESULT"
          test "$CHANGES_RESULT" = success
          if test "$UI_REQUIRED" = true; then
            test "$UI_EVIDENCE_RESULT" = success
          else
            test "$UI_EVIDENCE_RESULT" = skipped
          fi
          test "$RELEASE_READINESS_RESULT" = success

  e2e:
    needs: changes
    # OS-specific validation runs on main pushes, schedule and dispatch, not PRs.
    if: ${{ needs.changes.outputs.e2e == 'true' && github.event_name != 'pull_request' }}
    name: Install, sign-in and delegation (macOS)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Merged PRs may have a deleted branch; retain the reviewed history.
          ref: ${{ github.event.pull_request.merged && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lockb') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install browsers
        run: bun node_modules/playwright-core/cli.js install chromium webkit
      - name: Check spacing and keyboard behavior in Chromium
        run: |
          export PACER_TEST_BROWSER="$(bun -e 'import { chromium } from "playwright-core"; process.stdout.write(chromium.executablePath())')"
          bun run test test/app-spacing.test.tsx test/app-compact-density.test.tsx test/app-planner-preview-keyboard.test.tsx test/app-setup-health-gate-browser.test.tsx
      - name: Build CLI
        run: bun run build
      - name: Install, sign in and delegate
        run: bun run test:e2e

  # The ruleset on main requires one check per OS; it passes only when every shard did.
  test-result:
    name: Test (${{ matrix.os }})
    needs: test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Require every test shard to pass
        run: test "${{ needs.test.result }}" = success

  linux-service-survival:
    name: Linux service restart keeps running work
    needs: changes
    # OS-specific validation runs on main pushes, schedule and dispatch, not PRs.
    if: ${{ needs.changes.outputs.bun == 'true' && needs.changes.outputs.full == 'true' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merged && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lockb') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build CLI
        run: bun run build
      # A user service manager needs lingering; without it the check records UNVERIFIED.
      - name: Start the user service manager
        run: |
          sudo loginctl enable-linger "$USER" || echo 'User service manager unavailable; survival check will report UNVERIFIED'
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do test -S "/run/user/$(id -u)/bus" && break; sleep 1; done
      - name: Check that a detached run and a session host survive a restart
        run: bun scripts/ci/service-survival.ts

  secrets:
    name: Scan for secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Merged PRs may have a deleted branch; retain the reviewed history.
          ref: ${{ github.event.pull_request.merged && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Keep scanning compatible with read-only tokens, including fork PRs.
          GITLEAKS_ENABLE_COMMENTS: "false"
          # The job log is the report; artifacts count against the account storage quota.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  rust:
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # PRs run Rust logic on Linux; macOS runs on main pushes, schedule and dispatch.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest","macos-latest"]') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Merged PRs may have a deleted branch; retain the reviewed history.
          ref: ${{ github.event.pull_request.merged && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Integration tests run the TypeScript core behind the Rust front door.
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lockb') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Generated types fresh
        run: cargo xtask gen --check
      - name: Crate sizes (CRATE-1, CRATE-3, CRATE-7)
        run: cargo xtask loc --check
      - name: Crate layers and heavy dependencies (CRATE-2, CRATE-4, CRATE-5, CRATE-6)
        run: cargo xtask deps
      - name: Test
        run: cargo test --workspace --locked
      - name: Test Rust plugin SDK harness feature
        run: cargo test -p pacer-plugin --features testing --locked
      - name: Plugin conformance through the Rust front door
        run: |
          cargo build -p pacer -p pacer-fixtures --locked
          PACER_CORE_ARGV="[\"$(command -v bun)\",\"$PWD/src/cli.ts\"]" bun conformance/run.ts --host target/debug/pacer
      - name: Build timings (CRATE-9)
        if: matrix.os == 'ubuntu-latest' && needs.changes.outputs.timings == 'true'
        run: |
          cargo clean
          cargo build --workspace --timings
          touch crates/server/src/lib.rs
          cargo build --workspace --timings
      - name: Upload timings
        if: matrix.os == 'ubuntu-latest' && needs.changes.outputs.timings == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cargo-timings
          path: target/cargo-timings/