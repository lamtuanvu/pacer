name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review, converted_to_draft]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ui-evidence:
    name: UI review readiness
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # UI evidence compares verified PR base/head SHAs.
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check UI review evidence
        run: bun run ui:check --evidence-only

  test:
    name: Test (${{ matrix.os }})
    needs: [ui-evidence]
    # Run code validation even when manual review evidence is incomplete.
    if: ${{ always() }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # UI evidence compares verified PR base/head SHAs.
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      # The conformance suite builds the Rust fixture plugin.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.0
      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check UI policy
        run: bun run ui:check --source-only
      - name: Typecheck
        run: bun run typecheck
      - name: Build the Rust fixture plugin
        run: cargo build --locked -p pacer-fixtures --bin pacer-fixture
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build
      # These existing required checks must still reject incomplete evidence.
      - name: Require UI review readiness
        if: ${{ always() }}
        env:
          UI_EVIDENCE_RESULT: ${{ needs.ui-evidence.result }}
        run: |
          echo "UI review readiness: $UI_EVIDENCE_RESULT"
          test "$UI_EVIDENCE_RESULT" = success

  e2e:
    name: Install, sign-in and delegation (macOS)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install browsers
        run: bun node_modules/playwright-core/cli.js install chromium webkit
      - name: Build CLI
        run: bun run build
      - name: Install, sign in and delegate
        run: bun run test:e2e

  secrets:
    name: Scan for secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Keep scanning compatible with read-only tokens, including fork PRs.
          GITLEAKS_ENABLE_COMMENTS: "false"
          # The job log is the report; artifacts count against the account storage quota.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Integration tests run the TypeScript core behind the Rust front door.
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Generated types fresh
        run: cargo xtask gen --check
      - name: Crate sizes (CRATE-1, CRATE-3, CRATE-7)
        run: cargo xtask loc --check
      - name: Crate layers and heavy dependencies (CRATE-2, CRATE-4, CRATE-5, CRATE-6)
        run: cargo xtask deps
      - name: Test
        run: cargo test --workspace --locked
      - name: Plugin conformance through the Rust front door
        run: |
          cargo build -p pacer -p pacer-fixtures --locked
          PACER_CORE_ARGV="[\"$(command -v bun)\",\"$PWD/src/cli.ts\"]" bun conformance/run.ts --host target/debug/pacer
      - name: Build timings (CRATE-9)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo clean
          cargo build --workspace --timings
          touch crates/server/src/lib.rs
          cargo build --workspace --timings
      - name: Upload timings
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cargo-timings
          path: target/cargo-timings/
