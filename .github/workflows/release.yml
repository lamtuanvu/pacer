name: Release

on:
  push:
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      version:
        description: Package version to validate and build
        required: true
        type: string
      dry_run:
        description: Validate publishing without releasing (must be true)
        type: boolean
        default: true

env:
  VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
  DRY_RUN: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.dry_run) || false }}

permissions: {}

jobs:
  verify:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'release/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Verify release request
        run: |
          version=$(bun -p 'require("./package.json").version')
          if test "$GITHUB_EVENT_NAME" = workflow_dispatch; then
            test "$DRY_RUN" = true || { echo '::error::Non-dry dispatch refused; release with a version tag'; exit 1; }
            test "$VERSION" = "$version"
          elif test "$GITHUB_EVENT_NAME" = pull_request; then
            test "$GITHUB_HEAD_REF" = "release/v$version"
          else
            test "$GITHUB_REF_NAME" = "v$version"
          fi
      - id: version
        run: echo "version=$(bun -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.0
      - name: Build the Rust fixture plugin
        run: cargo build --locked -p pacer-fixtures --bin pacer-fixture
      - name: Test Rust plugin SDK harness feature
        run: cargo test -p pacer-plugin --features testing --locked
      - name: Install Linux test cross-build prerequisites
        if: runner.os == 'Linux'
        run: |
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
          python3 -m venv "$RUNNER_TEMP/pacer-cross"
          "$RUNNER_TEMP/pacer-cross/bin/pip" install --only-binary=:all: cargo-zigbuild==0.24.0 ziglang==0.14.1
          echo "$RUNNER_TEMP/pacer-cross/bin" >> "$GITHUB_PATH"
      # The frozen playwright-core dependency pins the matching Chromium revision.
      - name: Install locked Chromium test browser
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/pacer-playwright" >> "$GITHUB_ENV"
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/pacer-playwright" bun node_modules/playwright-core/cli.js install --with-deps chromium
      - run: bun run test

  build:
    needs: verify
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            targets: darwin-arm64,darwin-x64
          - runner: ubuntu-latest
            targets: linux-x64,linux-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Install Rust release targets
        run: |
          rustup show active-toolchain
          case "$RUNNER_OS" in
            macOS) rustup target add aarch64-apple-darwin x86_64-apple-darwin ;;
            Linux) rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl ;;
            *) exit 1 ;;
          esac
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-pair-${{ matrix.runner }}
      - name: Install Linux cross-build tools
        if: runner.os == 'Linux'
        run: |
          python3 -m venv "$RUNNER_TEMP/pacer-cross"
          "$RUNNER_TEMP/pacer-cross/bin/pip" install --only-binary=:all: cargo-zigbuild==0.24.0 ziglang==0.14.1
          echo "$RUNNER_TEMP/pacer-cross/bin" >> "$GITHUB_PATH"
      - name: Build runner targets
        env:
          TARGETS: ${{ matrix.targets }}
        run: bun scripts/release/build.ts --targets "$TARGETS"
      - name: Build the Rust fixture plugin for the M1 gate
        run: cargo build --locked -p pacer-fixtures --bin pacer-fixture
      # The frozen playwright-core dependency pins the matching Chromium revision.
      - name: Install locked Chromium for the M1 gate
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/pacer-playwright" >> "$GITHUB_ENV"
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/pacer-playwright" bun node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Full M1 gate against built host release artifacts
        run: |
          set -euo pipefail
          bun run gate:m1 --release-dir "dist/release/$VERSION" 2>&1 | tee "$RUNNER_TEMP/pacer-m1-gate.log"
      - name: Retain M1 gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m1-gate-${{ matrix.runner }}
          path: ${{ runner.temp }}/pacer-m1-gate.log
          retention-days: 7
          if-no-files-found: warn
      - name: Smoke test native binary
        run: |
          version="$VERSION"
          case "$(uname -s)" in Darwin) os=darwin ;; Linux) os=linux ;; *) exit 1 ;; esac
          case "$(uname -m)" in arm64|aarch64) arch=arm64 ;; x86_64) arch=x64 ;; *) exit 1 ;; esac
          test "$("./dist/release/$version/pacer-$os-$arch" --version)" = "pacer $version"
          test "$("./dist/release/$version/pacer-core-$os-$arch" --version)" = "pacer $version"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binaries-${{ matrix.runner }}
          path: dist/release/*/pacer-*
          retention-days: 1
          if-no-files-found: error

  desktop:
    needs: [verify, build]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      TARGET: ${{ matrix.target }}
      PLATFORM: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS desktop downloads are the signed, auto-updating app from desktop-build.
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
            cli_artifact: binaries-ubuntu-latest
            bundles: appimage,deb
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux-arm64
            cli_artifact: binaries-ubuntu-latest
            bundles: appimage,deb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libssl-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf squashfs-tools
      - name: Install pinned Rust toolchain and target
        working-directory: desktop/src-tauri
        run: |
          rustup show active-toolchain
          echo "RUSTUP_TOOLCHAIN=$(rustup show active-toolchain | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
          rustup target add "$TARGET"
      - name: Install desktop CLI
        working-directory: desktop
        run: bun install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ matrix.cli_artifact }}
          path: dist/release
      - name: Stage release CLI
        env:
          TAURI_TARGET_TRIPLE: ${{ matrix.target }}
        run: |
          cli="dist/release/$VERSION/pacer-$PLATFORM"
          core="dist/release/$VERSION/pacer-core-$PLATFORM"
          chmod +x "$cli" "$core"
          desktop/scripts/stage-cli.sh "$cli"
      - name: Fetch locked Rust dependencies
        working-directory: desktop/src-tauri
        run: cargo fetch --locked --target "$TARGET"
      - name: Build unsigned desktop bundles
        working-directory: desktop
        env:
          CARGO_NET_OFFLINE: 'true'
          BUNDLES: ${{ matrix.bundles }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            # The AppImage is repacked so linuxdeploy never rewrites the CLI (#217).
            ./scripts/build-linux-bundles.sh "../dist/release/$VERSION/pacer-$PLATFORM" "$VERSION" "$TARGET"
          else
            bunx --no-install tauri build --target "$TARGET" --bundles "$BUNDLES" --no-sign
          fi
      - name: Collect unsigned desktop bundles
        env:
          BUNDLES: ${{ matrix.bundles }}
        run: |
          bundle="desktop/src-tauri/target/$TARGET/release/bundle"
          mkdir -p dist/desktop
          case "$PLATFORM" in
            linux-*)
              case ",$BUNDLES," in
                *,appimage,*) cp "$bundle"/appimage/*.AppImage "dist/desktop/pacer-$VERSION-$PLATFORM-unsigned.AppImage" ;;
              esac
              cp "$bundle"/deb/*.deb "dist/desktop/pacer-$VERSION-$PLATFORM-unsigned.deb"
              ;;
            *) exit 1 ;;
          esac
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-${{ matrix.platform }}-unsigned
          path: dist/desktop/pacer-*
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: [verify, build, desktop]
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      TAG: v${{ needs.verify.outputs.version }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: binaries-*
          path: dist/release
          merge-multiple: true
      - name: Write checksums and metadata
        run: bun scripts/release/build.ts --write-only
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: desktop-linux-*-unsigned
          path: dist/release/${{ env.VERSION }}
          merge-multiple: true
      - name: Add desktop checksums
        run: |
          cd "dist/release/$VERSION"
          sha256sum pacer-*-unsigned.AppImage pacer-*-unsigned.deb >> SHA256SUMS
      - name: Extract release notes
        run: |
          awk -v heading="## [$VERSION]" '
            /^## / { if (found) exit; if ($0 == heading || index($0, heading " - ") == 1) { found=1; next } }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release-notes.md
          printf '\nThe app is not yet signed. On first open, Control-click pacer in Applications and choose Open.\n' >> release-notes.md
      - name: Preview release assets and notes
        if: env.DRY_RUN == 'true'
        run: |
          sha256sum dist/release/"$VERSION"/* dist/release/latest.json
          cat release-notes.md
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        if: env.DRY_RUN != 'true'
        with:
          subject-path: dist/release/*/pacer-*
      - name: Publish release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$VERSION"
          case "$version" in
            *-*) set -- --prerelease --latest=false ;;
            *) set -- --latest ;;
          esac
          gh release create "$TAG" --verify-tag --title "pacer $version" \
            --notes-file release-notes.md "$@" \
            dist/release/"$version"/pacer-* \
            dist/release/"$version"/SHA256SUMS \
            dist/release/"$version"/manifest.json dist/release/latest.json

  npm:
    needs: [verify, publish]
    if: >-
      always() && needs.publish.result == 'success' &&
      ((github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.dry_run)) ||
      (github.event_name == 'push' && vars.NPM_TRUSTED_PUBLISHING == 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      TAG: v${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
          check-latest: true
      - run: npm install -g npm@11
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: env.DRY_RUN == 'true'
        with:
          pattern: binaries-*
          path: dist/release
          merge-multiple: true
      - name: Write dry-run metadata
        if: env.DRY_RUN == 'true'
        run: bun scripts/release/build.ts --write-only
      - name: Download published binaries
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --dir "dist/release/$VERSION" \
            --pattern 'pacer-*' --pattern manifest.json
      - run: bun run release:npm --release-dir "dist/release/$VERSION" --out dist/npm
      - name: Publish npm packages in dependency order
        run: |
          set -euo pipefail
          case "$VERSION" in *-*) tag=next ;; *) tag=latest ;; esac
          while IFS= read -r package; do
            dir="$PWD/dist/npm/$package"
            name=$(bun -p 'require(process.argv[1]).name' "$dir/package.json")
            if npm view "$name@$VERSION" version > /dev/null 2>&1; then
              echo "skipped: $name@$VERSION already published"
            elif test "$DRY_RUN" = true; then
              (cd "$dir" && npm publish --dry-run --access public --tag "$tag")
            else
              (cd "$dir" && npm publish --provenance --access public --tag "$tag")
            fi
          done < dist/npm/publish-order.txt

  homebrew:
    needs: [verify, publish]
    if: >-
      always() && needs.publish.result == 'success' &&
      ((github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.dry_run)) ||
      (github.event_name == 'push' && !contains(needs.verify.outputs.version, '-')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      TAG: v${{ needs.verify.outputs.version }}
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Check tap publishing configuration
        id: tap
        run: |
          if test "$DRY_RUN" = true || test -n "$HOMEBREW_TAP_TOKEN"; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo '::notice::skipped: HOMEBREW_TAP_TOKEN not set'
          fi
      - name: Check tap token can push
        if: env.HOMEBREW_TAP_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.HOMEBREW_TAP_TOKEN }}
        run: |
          push=$(gh api repos/lamtuanvu/homebrew-tap --jq .permissions.push)
          test "$push" = true || { echo '::error::HOMEBREW_TAP_TOKEN cannot push to lamtuanvu/homebrew-tap'; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.tap.outputs.enabled == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.tap.outputs.enabled == 'true'
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: env.DRY_RUN == 'true'
        with:
          pattern: binaries-*
          path: dist/release
          merge-multiple: true
      - name: Write dry-run metadata
        if: env.DRY_RUN == 'true'
        run: bun scripts/release/build.ts --write-only
      - name: Download published manifest
        if: steps.tap.outputs.enabled == 'true' && env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" --dir "dist/release/$VERSION" --pattern manifest.json
      - name: Generate and publish Homebrew formula
        if: steps.tap.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          if test "$DRY_RUN" = true; then
            bun run release:homebrew --manifest "dist/release/$VERSION/manifest.json" --out Formula/pacer.rb
            ruby -c Formula/pacer.rb
            cat Formula/pacer.rb
            exit 0
          fi
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$HOMEBREW_TAP_TOKEN" | base64 | tr -d '\n')"
          git_auth() { git -c "http.extraheader=$auth" "$@"; }
          git_auth clone --branch main --single-branch https://github.com/lamtuanvu/homebrew-tap tap
          bun run release:homebrew --manifest "dist/release/$VERSION/manifest.json" --out tap/Formula/pacer.rb
          cd tap
          git add Formula/pacer.rb
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -s -m "pacer $VERSION"
          git_auth push origin HEAD:main

  # Opt-in production builds also run before tagging, so signing is validated in dry runs.
  # Existing CLI/npm/Homebrew/plugin jobs never depend on desktop completion.
  desktop-build:
    needs: verify
    if: >-
      (github.event_name == 'push' || (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.dry_run))) &&
      vars.PACER_DESKTOP_RELEASE_ENABLED == 'true' &&
      !contains(needs.verify.outputs.version, '-')
    environment: desktop-release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: aarch64
          - runner: macos-15-intel
            arch: x86_64
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      ARCH: ${{ matrix.arch }}
      PACER_OTA_PUBLIC_KEY: ${{ vars.PACER_OTA_PUBLIC_KEY }}
      PACER_APPLE_TEAM_ID: ${{ vars.PACER_APPLE_TEAM_ID }}
      # Interim signer until a Developer ID exists (docs/specs/2026-10-20-interim-self-signed-ota-design.md).
      PACER_SIGNING_CERT_SHA1: ${{ vars.PACER_SIGNING_CERT_SHA1 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Verify native runner and production trust
        run: |
          set -euo pipefail
          test -n "$PACER_OTA_PUBLIC_KEY"
          test -n "$PACER_APPLE_TEAM_ID" || test -n "$PACER_SIGNING_CERT_SHA1"
          actual=$(uname -m)
          if test "$actual" = arm64; then actual=aarch64; fi
          test "$actual" = "$ARCH"
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: desktop
      - name: Probe production signing identity
        env:
          # The runner context is unavailable in job-level env; credential steps set it.
          PACER_SIGNING_CLEANUP_RECORD: ${{ runner.temp }}/pacer-desktop-sign.json
          PACER_SELF_SIGNING_CERTIFICATE_BASE64: ${{ secrets.PACER_SELF_SIGNING_CERTIFICATE_BASE64 }}
          PACER_SELF_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.PACER_SELF_SIGNING_CERTIFICATE_PASSWORD }}
          PACER_APPLE_SIGNING_IDENTITY: ${{ vars.PACER_APPLE_SIGNING_IDENTITY }}
          PACER_APPLE_CERTIFICATE_BASE64: ${{ secrets.PACER_APPLE_CERTIFICATE_BASE64 }}
          PACER_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.PACER_APPLE_CERTIFICATE_PASSWORD }}
          PACER_NOTARY_KEY: ${{ secrets.PACER_NOTARY_KEY }}
          PACER_NOTARY_KEY_ID: ${{ vars.PACER_NOTARY_KEY_ID }}
          PACER_NOTARY_ISSUER: ${{ vars.PACER_NOTARY_ISSUER }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun scripts/release/desktop-credentials.ts --probe
      - name: Fetch pinned Rust dependencies
        working-directory: desktop/src-tauri
        run: |
          rustup show active-toolchain
          cargo fetch --locked
          (cd ../.. && cargo fetch --locked)
      - name: Build production desktop components offline
        env:
          CARGO_NET_OFFLINE: 'true'
        run: |
          set -euo pipefail
          bun scripts/release/build.ts --host --desktop-production --out dist/desktop-cli
          (cd desktop && bunx --no-install tauri build --bundles app --no-sign --features ota-production)
          cargo build --offline --locked --release --features ota-production --manifest-path desktop/src-tauri/Cargo.toml --bin pacer-update-helper
          cp -R desktop/src-tauri/target/release/bundle/macos/pacer.app "dist/desktop-cli/$VERSION/pacer.app"
          cp desktop/src-tauri/target/release/pacer-update-helper "dist/desktop-cli/$VERSION/pacer-update-helper"
      - name: Sign complete app (Developer ID builds also notarize and staple) and version-sign final artifact
        env:
          # The runner context is unavailable in job-level env; credential steps set it.
          PACER_SIGNING_CLEANUP_RECORD: ${{ runner.temp }}/pacer-desktop-sign.json
          PACER_SELF_SIGNING_CERTIFICATE_BASE64: ${{ secrets.PACER_SELF_SIGNING_CERTIFICATE_BASE64 }}
          PACER_SELF_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.PACER_SELF_SIGNING_CERTIFICATE_PASSWORD }}
          PACER_APPLE_SIGNING_IDENTITY: ${{ vars.PACER_APPLE_SIGNING_IDENTITY }}
          PACER_APPLE_CERTIFICATE_BASE64: ${{ secrets.PACER_APPLE_CERTIFICATE_BASE64 }}
          PACER_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.PACER_APPLE_CERTIFICATE_PASSWORD }}
          PACER_NOTARY_KEY: ${{ secrets.PACER_NOTARY_KEY }}
          PACER_NOTARY_KEY_ID: ${{ vars.PACER_NOTARY_KEY_ID }}
          PACER_NOTARY_ISSUER: ${{ vars.PACER_NOTARY_ISSUER }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun scripts/release/desktop-credentials.ts "dist/desktop-cli/$VERSION" "$ARCH" dist/desktop-assets
      - name: Clean ephemeral signing credentials
        if: always()
        env:
          PACER_SIGNING_CLEANUP_RECORD: ${{ runner.temp }}/pacer-desktop-sign.json
        run: bun scripts/release/desktop-credentials.ts --cleanup
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: |
            dist/desktop-assets/*.app.tar.gz
            dist/desktop-assets/*.dmg
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-signed-${{ matrix.arch }}
          path: dist/desktop-assets/*
          if-no-files-found: error
          retention-days: 7

  desktop-publish:
    needs: [verify, desktop-build, publish]
    if: >-
      github.event_name == 'push' && vars.PACER_DESKTOP_RELEASE_ENABLED == 'true' &&
      !contains(needs.verify.outputs.version, '-')
    environment: desktop-release
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      PACER_OTA_PUBLIC_KEY: ${{ vars.PACER_OTA_PUBLIC_KEY }}
      PACER_APPLE_TEAM_ID: ${{ vars.PACER_APPLE_TEAM_ID }}
      PACER_SIGNING_CERT_SHA1: ${{ vars.PACER_SIGNING_CERT_SHA1 }}
      PACER_DESKTOP_RELEASE_ENABLED: ${{ vars.PACER_DESKTOP_RELEASE_ENABLED }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: desktop-signed-*
          path: dist/desktop-assets
          merge-multiple: true
      - name: Prepare deterministic desktop metadata
        run: bun scripts/release/desktop-release.ts prepare dist/desktop-assets "$VERSION"
      - name: Verify signed architecture packages before any publication
        run: bun scripts/release/desktop-release.ts validate dist/desktop-assets "$VERSION" > dist/desktop-feed-preview.json
      - name: Publish immutable desktop assets and compare-and-swap stable feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/release/desktop-release.ts publish dist/desktop-assets "$VERSION"

  crates:
    needs: [verify, publish]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: rustup show active-toolchain
      - name: Publish protocol then SDK with immutable archive checks
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bun scripts/release/crates.ts --publish

  desktop-fixture:
    needs: verify
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.dry_run)
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: desktop
      - name: Exercise local fixture signing, immutable retry and feed promotion
        run: bun scripts/release/desktop-feed-fixture.ts --fixture dist/desktop-feed-fixture
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-feed-fixture-evidence
          path: |
            dist/desktop-feed-fixture/report.json
            dist/desktop-feed-fixture/stable.json
          if-no-files-found: error
          retention-days: 7
