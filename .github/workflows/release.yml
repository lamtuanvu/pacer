name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: Package version to validate and build
        required: true
        type: string
      dry_run:
        description: Validate publishing without releasing (must be true)
        type: boolean
        default: true

env:
  VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
  DRY_RUN: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.dry_run) || false }}

permissions: {}

jobs:
  verify:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'release/v'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.channel.outputs.channel }}
      parent: ${{ steps.channel.outputs.parent }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A nightly stamp commit is checked against its parent, the main commit it was built from.
          fetch-depth: 2
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Verify release request
        run: |
          version=$(bun -p 'require("./package.json").version')
          if test "$GITHUB_EVENT_NAME" = workflow_dispatch; then
            test "$DRY_RUN" = true || { echo '::error::Non-dry dispatch refused; release with a version tag'; exit 1; }
            test "$VERSION" = "$version"
          elif test "$GITHUB_EVENT_NAME" = pull_request; then
            test "$GITHUB_HEAD_REF" = "release/v$version"
          else
            test "$GITHUB_REF_NAME" = "v$version"
          fi
      - id: version
        run: echo "version=$(bun -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      - run: bun install --frozen-lockfile
      - name: Classify the release channel
        id: channel
        run: |
          version=$(bun -p 'require("./package.json").version')
          channel=$(bun scripts/release/nightly.ts classify "$version")
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          if test "$channel" = nightly; then
            parent=$(git rev-parse HEAD^)
            bun scripts/release/nightly.ts check-diff "$parent" HEAD
            # A nightly builds a main commit; a stamp on any other commit is refused.
            git fetch --quiet --no-tags origin main
            git merge-base --is-ancestor "$parent" FETCH_HEAD \
              || { echo "::error::The nightly's parent $parent is not on main"; exit 1; }
            echo "parent=$parent" >> "$GITHUB_OUTPUT"
          fi
      - run: bun run typecheck

  # REL-2 (amendment 0.24.0, proposed): the release only builds and publishes.
  # Validation of the built release artifacts runs post-merge on main in ci.yml.
  # One job per OS, one matrix leg per target, so desktop can start after Linux alone.
  build-macos:
    needs: verify
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    runs-on: ${{ matrix.image }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: darwin
            arch: arm64
            target: darwin-arm64
            image: macos-15
            rust_target: aarch64-apple-darwin
          - os: darwin
            arch: x64
            target: darwin-x64
            image: macos-15
            rust_target: x86_64-apple-darwin
            smoke_prefix: arch -x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Install Rust release targets
        run: |
          rustup show active-toolchain
          rustup target add ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-${{ matrix.target }}
      - name: Build runner targets
        env:
          TARGETS: ${{ matrix.target }}
        run: bun scripts/release/build.ts --targets "$TARGETS"
      - name: Smoke test native binary
        run: |
          version="$VERSION"
          os="${{ matrix.os }}"
          arch="${{ matrix.arch }}"
          # matrix.smoke_prefix is empty for native legs; darwin-x64 runs under Rosetta.
          run_bin() { ${{ matrix.smoke_prefix }} "$@"; }
          test "$(run_bin "./dist/release/$version/pacer-$os-$arch" --version)" = "pacer $version"
          test "$(run_bin "./dist/release/$version/pacer-core-$os-$arch" --version)" = "pacer $version"
          # Native assistant plugin is built with pacer-core when crates/assistant-pacer is present.
          # When the crate is in tree the release asset is required (not optional).
          assistant="./dist/release/$version/pacer-assistant-pacer-$os-$arch"
          if [ -f crates/assistant-pacer/Cargo.toml ]; then
            test -x "$assistant"
            # Handshake smoke: prove the binary speaks plugin.hello with the bundled id/version.
            hello=$(printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"plugin.hello","params":{"protocol":"1.11.0","config":{},"grants":[]}}' | run_bin "$assistant" | head -n 1)
            echo "$hello" | grep -q '"id":"assistant-pacer"'
            echo "$hello" | grep -q '"version":"1.0.0"'
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binaries-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/release/*/pacer-*
          retention-days: 1
          if-no-files-found: error

  build-linux:
    needs: verify
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    runs-on: ${{ matrix.image }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x64
            target: linux-x64
            image: ubuntu-24.04
            rust_target: x86_64-unknown-linux-musl
          - os: linux
            arch: arm64
            target: linux-arm64
            image: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Install Rust release targets
        run: |
          rustup show active-toolchain
          rustup target add ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-${{ matrix.target }}
      - name: Install Linux cross-build tools
        run: |
          python3 -m venv "$RUNNER_TEMP/pacer-cross"
          "$RUNNER_TEMP/pacer-cross/bin/pip" install --only-binary=:all: cargo-zigbuild==0.24.0 ziglang==0.14.1
          echo "$RUNNER_TEMP/pacer-cross/bin" >> "$GITHUB_PATH"
      - name: Build runner targets
        env:
          TARGETS: ${{ matrix.target }}
        run: bun scripts/release/build.ts --targets "$TARGETS"
      - name: Smoke test native binary
        run: |
          version="$VERSION"
          os="${{ matrix.os }}"
          arch="${{ matrix.arch }}"
          test "$("./dist/release/$version/pacer-$os-$arch" --version)" = "pacer $version"
          test "$("./dist/release/$version/pacer-core-$os-$arch" --version)" = "pacer $version"
          # Native assistant plugin is built with pacer-core when crates/assistant-pacer is present.
          # When the crate is in tree the release asset is required (not optional).
          assistant="./dist/release/$version/pacer-assistant-pacer-$os-$arch"
          if [ -f crates/assistant-pacer/Cargo.toml ]; then
            test -x "$assistant"
            # Handshake smoke: prove the binary speaks plugin.hello with the bundled id/version.
            hello=$(printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"plugin.hello","params":{"protocol":"1.11.0","config":{},"grants":[]}}' | "$assistant" | head -n 1)
            echo "$hello" | grep -q '"id":"assistant-pacer"'
            echo "$hello" | grep -q '"version":"1.0.0"'
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binaries-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/release/*/pacer-*
          retention-days: 1
          if-no-files-found: error

  desktop:
    needs: [verify, build-linux]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      TARGET: ${{ matrix.target }}
      PLATFORM: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS desktop downloads are the signed, auto-updating app from desktop-build.
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
            cli_artifact: binaries-linux-x64
            bundles: appimage,deb
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux-arm64
            cli_artifact: binaries-linux-arm64
            bundles: appimage,deb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ] && ! getent hosts azure.archive.ubuntu.com >/dev/null; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libssl-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf squashfs-tools
      - name: Install pinned Rust toolchain and target
        working-directory: desktop/src-tauri
        run: |
          rustup show active-toolchain
          echo "RUSTUP_TOOLCHAIN=$(rustup show active-toolchain | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
          rustup target add "$TARGET"
      - name: Install app dependencies
        run: bun install --frozen-lockfile
      - name: Install desktop CLI
        working-directory: desktop
        run: bun install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ matrix.cli_artifact }}
          path: dist/release
      - name: Stage release CLI
        env:
          TAURI_TARGET_TRIPLE: ${{ matrix.target }}
        run: |
          cli="dist/release/$VERSION/pacer-$PLATFORM"
          core="dist/release/$VERSION/pacer-core-$PLATFORM"
          # Artifacts drop the executable bit; stage-cli.sh silently skips a non-executable
          # assistant plugin, and Tauri then refuses the missing externalBin. Pass it explicitly.
          assistant="dist/release/$VERSION/pacer-assistant-pacer-$PLATFORM"
          chmod +x "$cli" "$core" "$assistant"
          desktop/scripts/stage-cli.sh "$cli" "$core" "$assistant"
      - name: Fetch locked Rust dependencies
        working-directory: desktop/src-tauri
        run: cargo fetch --locked --target "$TARGET"
      - name: Build unsigned desktop bundles
        working-directory: desktop
        env:
          CARGO_NET_OFFLINE: 'true'
          BUNDLES: ${{ matrix.bundles }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            # The AppImage is repacked so linuxdeploy never rewrites the CLI (#217).
            ./scripts/build-linux-bundles.sh "../dist/release/$VERSION/pacer-$PLATFORM" "$VERSION" "$TARGET"
          else
            bunx --no-install tauri build --target "$TARGET" --bundles "$BUNDLES" --no-sign
          fi
      - name: Collect unsigned desktop bundles
        env:
          BUNDLES: ${{ matrix.bundles }}
        run: |
          bundle="desktop/src-tauri/target/$TARGET/release/bundle"
          mkdir -p dist/desktop
          case "$PLATFORM" in
            linux-*)
              case ",$BUNDLES," in
                *,appimage,*) cp "$bundle"/appimage/*.AppImage "dist/desktop/pacer-$VERSION-$PLATFORM-unsigned.AppImage" ;;
              esac
              cp "$bundle"/deb/*.deb "dist/desktop/pacer-$VERSION-$PLATFORM-unsigned.deb"
              ;;
            *) exit 1 ;;
          esac
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-${{ matrix.platform }}-unsigned
          path: dist/desktop/pacer-*
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: [verify, build-macos, build-linux, desktop]
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      TAG: v${{ needs.verify.outputs.version }}
      CHANNEL: ${{ needs.verify.outputs.channel }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: binaries-*
          path: dist/release
          merge-multiple: true
      - name: Write checksums and metadata
        run: bun scripts/release/build.ts --write-only
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: desktop-linux-*-unsigned
          path: dist/release/${{ env.VERSION }}
          merge-multiple: true
      - name: Add desktop checksums
        run: |
          cd "dist/release/$VERSION"
          sha256sum pacer-*-unsigned.AppImage pacer-*-unsigned.deb >> SHA256SUMS
      - name: Extract release notes
        run: |
          if test "${CHANNEL:-}" = nightly; then
            # Commit titles on main since the previous nightly's parent (or the latest stable tag).
            previous=$(git tag -l 'v*-nightly.*' --sort=-v:refname | awk -v current="v$VERSION" 'found { print; exit } $0 == current { found = 1 }')
            if test -n "$previous"; then from="$previous^"; else from=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -v -- - | head -n 1 || true); fi
            test -n "$from" || { echo '::error::no previous nightly or stable tag to start the notes from'; exit 1; }
            bun scripts/release/nightly.ts notes "$VERSION" "$from" HEAD^ > release-notes.md
          else
            awk -v heading="## [$VERSION]" '
              /^## / { if (found) exit; if ($0 == heading || index($0, heading " - ") == 1) { found=1; next } }
              found { print }
              END { if (!found) exit 1 }
            ' CHANGELOG.md > release-notes.md
          fi
          printf '\nThe app is not yet signed. On first open, Control-click pacer in Applications and choose Open.\n' >> release-notes.md
      - name: Preview release assets and notes
        if: env.DRY_RUN == 'true'
        run: |
          sha256sum dist/release/"$VERSION"/* dist/release/latest.json
          cat release-notes.md
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        if: env.DRY_RUN != 'true'
        with:
          subject-path: dist/release/*/pacer-*
      - name: Publish release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$VERSION"
          case "$version" in
            *-*) set -- --prerelease --latest=false ;;
            *) set -- --latest ;;
          esac
          gh release create "$TAG" --verify-tag --title "pacer $version" \
            --notes-file release-notes.md "$@" \
            dist/release/"$version"/pacer-* \
            dist/release/"$version"/SHA256SUMS \
            dist/release/"$version"/manifest.json dist/release/latest.json

  npm:
    needs: [verify, publish]
    if: >-
      always() && needs.publish.result == 'success' &&
      ((github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.dry_run)) ||
      (github.event_name == 'push' && vars.NPM_TRUSTED_PUBLISHING == 'true'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      TAG: v${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
          check-latest: true
      - run: npm install -g npm@11
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: env.DRY_RUN == 'true'
        with:
          pattern: binaries-*
          path: dist/release
          merge-multiple: true
      - name: Write dry-run metadata
        if: env.DRY_RUN == 'true'
        run: bun scripts/release/build.ts --write-only
      - name: Download published binaries
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # SHA256SUMS: release:npm verifies the assistant-pacer sibling against the published checksum.
          gh release download "$TAG" --dir "dist/release/$VERSION" \
            --pattern 'pacer-*' --pattern manifest.json --pattern SHA256SUMS
      - run: bun run release:npm --release-dir "dist/release/$VERSION" --out dist/npm
      - name: Publish npm packages in dependency order
        run: |
          set -euo pipefail
          case "$VERSION" in *-nightly.*) tag=nightly ;; *-*) tag=next ;; *) tag=latest ;; esac
          while IFS= read -r package; do
            dir="$PWD/dist/npm/$package"
            name=$(bun -p 'require(process.argv[1]).name' "$dir/package.json")
            if npm view "$name@$VERSION" version > /dev/null 2>&1; then
              echo "skipped: $name@$VERSION already published"
            elif test "$DRY_RUN" = true; then
              (cd "$dir" && npm publish --dry-run --access public --tag "$tag")
            else
              (cd "$dir" && npm publish --provenance --access public --tag "$tag")
            fi
          done < dist/npm/publish-order.txt

  homebrew:
    needs: [verify, publish]
    if: >-
      always() && needs.publish.result == 'success' &&
      ((github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.dry_run)) ||
      (github.event_name == 'push' && !contains(needs.verify.outputs.version, '-')))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      TAG: v${{ needs.verify.outputs.version }}
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Check tap publishing configuration
        id: tap
        run: |
          if test "$DRY_RUN" = true || test -n "$HOMEBREW_TAP_TOKEN"; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo '::notice::skipped: HOMEBREW_TAP_TOKEN not set'
          fi
      - name: Check tap token can push
        if: env.HOMEBREW_TAP_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.HOMEBREW_TAP_TOKEN }}
        run: |
          push=$(gh api repos/lamtuanvu/homebrew-tap --jq .permissions.push)
          test "$push" = true || { echo '::error::HOMEBREW_TAP_TOKEN cannot push to lamtuanvu/homebrew-tap'; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.tap.outputs.enabled == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.tap.outputs.enabled == 'true'
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: env.DRY_RUN == 'true'
        with:
          pattern: binaries-*
          path: dist/release
          merge-multiple: true
      - name: Write dry-run metadata
        if: env.DRY_RUN == 'true'
        run: bun scripts/release/build.ts --write-only
      - name: Download published manifest
        if: steps.tap.outputs.enabled == 'true' && env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" --dir "dist/release/$VERSION" --pattern manifest.json
      - name: Generate and publish Homebrew formula
        if: steps.tap.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          if test "$DRY_RUN" = true; then
            bun run release:homebrew --manifest "dist/release/$VERSION/manifest.json" --out Formula/pacer.rb
            ruby -c Formula/pacer.rb
            cat Formula/pacer.rb
            exit 0
          fi
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$HOMEBREW_TAP_TOKEN" | base64 | tr -d '\n')"
          git_auth() { git -c "http.extraheader=$auth" "$@"; }
          git_auth clone --branch main --single-branch https://github.com/lamtuanvu/homebrew-tap tap
          bun run release:homebrew --manifest "dist/release/$VERSION/manifest.json" --out tap/Formula/pacer.rb
          cd tap
          git add Formula/pacer.rb
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -s -m "pacer $VERSION"
          git_auth push origin HEAD:main

  # Opt-in production builds also run before tagging, so signing is validated in dry runs.
  # Existing CLI/npm/Homebrew/plugin jobs never depend on desktop completion.
  desktop-build:
    needs: verify
    if: >-
      (github.event_name == 'push' || (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.dry_run))) &&
      vars.PACER_DESKTOP_RELEASE_ENABLED == 'true' &&
      (needs.verify.outputs.channel == 'stable' || needs.verify.outputs.channel == 'nightly')
    environment: desktop-release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: aarch64
          - runner: macos-15-intel
            arch: x86_64
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      ARCH: ${{ matrix.arch }}
      PACER_OTA_PUBLIC_KEY: ${{ vars.PACER_OTA_PUBLIC_KEY }}
      PACER_APPLE_TEAM_ID: ${{ vars.PACER_APPLE_TEAM_ID }}
      # Interim signer until a Developer ID exists (docs/specs/2026-10-20-interim-self-signed-ota-design.md).
      PACER_SIGNING_CERT_SHA1: ${{ vars.PACER_SIGNING_CERT_SHA1 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Verify native runner and production trust
        run: |
          set -euo pipefail
          test -n "$PACER_OTA_PUBLIC_KEY"
          test -n "$PACER_APPLE_TEAM_ID" || test -n "$PACER_SIGNING_CERT_SHA1"
          actual=$(uname -m)
          if test "$actual" = arm64; then actual=aarch64; fi
          test "$actual" = "$ARCH"
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: desktop
      - name: Probe production signing identity
        env:
          # The runner context is unavailable in job-level env; credential steps set it.
          PACER_SIGNING_CLEANUP_RECORD: ${{ runner.temp }}/pacer-desktop-sign.json
          PACER_SELF_SIGNING_CERTIFICATE_BASE64: ${{ secrets.PACER_SELF_SIGNING_CERTIFICATE_BASE64 }}
          PACER_SELF_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.PACER_SELF_SIGNING_CERTIFICATE_PASSWORD }}
          PACER_APPLE_SIGNING_IDENTITY: ${{ vars.PACER_APPLE_SIGNING_IDENTITY }}
          PACER_APPLE_CERTIFICATE_BASE64: ${{ secrets.PACER_APPLE_CERTIFICATE_BASE64 }}
          PACER_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.PACER_APPLE_CERTIFICATE_PASSWORD }}
          PACER_NOTARY_KEY: ${{ secrets.PACER_NOTARY_KEY }}
          PACER_NOTARY_KEY_ID: ${{ vars.PACER_NOTARY_KEY_ID }}
          PACER_NOTARY_ISSUER: ${{ vars.PACER_NOTARY_ISSUER }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun scripts/release/desktop-credentials.ts --probe
      - name: Fetch pinned Rust dependencies
        working-directory: desktop/src-tauri
        run: |
          rustup show active-toolchain
          cargo fetch --locked
          (cd ../.. && cargo fetch --locked)
      - name: Build production desktop components offline
        env:
          CARGO_NET_OFFLINE: 'true'
        run: |
          set -euo pipefail
          bun scripts/release/build.ts --host --desktop-production --out dist/desktop-cli
          (cd desktop && bunx --no-install tauri build --bundles app --no-sign --features ota-production)
          cargo build --offline --locked --release --features ota-production --manifest-path desktop/src-tauri/Cargo.toml --bin pacer-update-helper
          cp -R desktop/src-tauri/target/release/bundle/macos/pacer.app "dist/desktop-cli/$VERSION/pacer.app"
          cp desktop/src-tauri/target/release/pacer-update-helper "dist/desktop-cli/$VERSION/pacer-update-helper"
      - name: Sign complete app (Developer ID builds also notarize and staple) and version-sign final artifact
        env:
          # The runner context is unavailable in job-level env; credential steps set it.
          PACER_SIGNING_CLEANUP_RECORD: ${{ runner.temp }}/pacer-desktop-sign.json
          PACER_SELF_SIGNING_CERTIFICATE_BASE64: ${{ secrets.PACER_SELF_SIGNING_CERTIFICATE_BASE64 }}
          PACER_SELF_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.PACER_SELF_SIGNING_CERTIFICATE_PASSWORD }}
          PACER_APPLE_SIGNING_IDENTITY: ${{ vars.PACER_APPLE_SIGNING_IDENTITY }}
          PACER_APPLE_CERTIFICATE_BASE64: ${{ secrets.PACER_APPLE_CERTIFICATE_BASE64 }}
          PACER_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.PACER_APPLE_CERTIFICATE_PASSWORD }}
          PACER_NOTARY_KEY: ${{ secrets.PACER_NOTARY_KEY }}
          PACER_NOTARY_KEY_ID: ${{ vars.PACER_NOTARY_KEY_ID }}
          PACER_NOTARY_ISSUER: ${{ vars.PACER_NOTARY_ISSUER }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun scripts/release/desktop-credentials.ts "dist/desktop-cli/$VERSION" "$ARCH" dist/desktop-assets
      - name: Clean ephemeral signing credentials
        if: always()
        env:
          PACER_SIGNING_CLEANUP_RECORD: ${{ runner.temp }}/pacer-desktop-sign.json
        run: bun scripts/release/desktop-credentials.ts --cleanup
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: |
            dist/desktop-assets/*.app.tar.gz
            dist/desktop-assets/*.dmg
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-signed-${{ matrix.arch }}
          path: dist/desktop-assets/*
          if-no-files-found: error
          retention-days: 7

  desktop-publish:
    needs: [verify, desktop-build, publish]
    if: >-
      github.event_name == 'push' && vars.PACER_DESKTOP_RELEASE_ENABLED == 'true' &&
      (needs.verify.outputs.channel == 'stable' || needs.verify.outputs.channel == 'nightly')
    environment: desktop-release
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      CHANNEL: ${{ needs.verify.outputs.channel }}
      PACER_OTA_PUBLIC_KEY: ${{ vars.PACER_OTA_PUBLIC_KEY }}
      PACER_APPLE_TEAM_ID: ${{ vars.PACER_APPLE_TEAM_ID }}
      PACER_SIGNING_CERT_SHA1: ${{ vars.PACER_SIGNING_CERT_SHA1 }}
      PACER_DESKTOP_RELEASE_ENABLED: ${{ vars.PACER_DESKTOP_RELEASE_ENABLED }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: desktop-signed-*
          path: dist/desktop-assets
          merge-multiple: true
      - name: Prepare deterministic desktop metadata
        run: |
          if test "${CHANNEL:-}" = nightly; then
            # The same notes as the GitHub Release; prepare cuts them to the desktop limit.
            previous=$(git tag -l 'v*-nightly.*' --sort=-v:refname | awk -v current="v$VERSION" 'found { print; exit } $0 == current { found = 1 }')
            if test -n "$previous"; then from="$previous^"; else from=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -v -- - | head -n 1 || true); fi
            test -n "$from" || { echo '::error::no previous nightly or stable tag to start the notes from'; exit 1; }
            bun scripts/release/nightly.ts notes "$VERSION" "$from" HEAD^ > release-notes.md
            bun scripts/release/desktop-release.ts prepare dist/desktop-assets "$VERSION" --notes-file release-notes.md
          else
            bun scripts/release/desktop-release.ts prepare dist/desktop-assets "$VERSION"
          fi
      - name: Verify signed architecture packages before any publication
        run: bun scripts/release/desktop-release.ts validate dist/desktop-assets "$VERSION" > dist/desktop-feed-preview.json
      # desktop-release.ts picks stable.json or nightly.json from the version.
      - name: Publish immutable desktop assets and compare-and-swap the channel feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/release/desktop-release.ts publish dist/desktop-assets "$VERSION"

  crates:
    needs: [verify, publish]
    if: github.event_name == 'push' && !contains(needs.verify.outputs.version, '-')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: rustup show active-toolchain
      - name: Publish protocol then SDK with immutable archive checks
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bun scripts/release/crates.ts --publish

  # The CLI nightly feed advances only after the desktop nightly feed, so both channels move together.
  cli-feed:
    needs: [verify, publish, desktop-publish]
    if: github.event_name == 'push' && needs.verify.outputs.channel == 'nightly' && needs.desktop-publish.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Compare-and-swap the CLI nightly feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/release/cli-feed.ts publish "$VERSION"
      - name: Close nightly failure issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          for issue in $(gh issue list --repo "$GITHUB_REPOSITORY" --label nightly-failure --state open --json number --jq '.[].number'); do
            gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --comment "Nightly $VERSION published: $url"
          done

  # A nightly tag whose release fails reports to the same issue as nightly.yml; the next published nightly closes it.
  nightly-failure:
    needs: [verify, build-macos, build-linux, desktop, publish, npm, homebrew, desktop-build, desktop-publish, crates, cli-feed]
    # verify can fail before it classifies the channel, so the tag name also identifies a nightly.
    if: always() && github.event_name == 'push' && (needs.verify.outputs.channel == 'nightly' || contains(github.ref_name, '-nightly.')) && contains(needs.*.result, 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      # Keep this script identical to nightly.yml's Report failure step.
      - name: Report failure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --label nightly-failure --state open --json number --jq '.[0].number // empty')
          if test -n "$issue"; then
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "Nightly failed again: $url"
          else
            gh label create nightly-failure --repo "$GITHUB_REPOSITORY" --color B60205 --description "A nightly build failed" --force
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Nightly build failed" --label nightly-failure \
              --body "The nightly build failed: $url. The next published nightly closes this issue."
          fi

  desktop-fixture:
    needs: verify
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.dry_run)
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: desktop
      - name: Exercise local fixture signing, immutable retry and feed promotion
        run: bun scripts/release/desktop-feed-fixture.ts --fixture dist/desktop-feed-fixture
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-feed-fixture-evidence
          path: |
            dist/desktop-feed-fixture/report.json
            dist/desktop-feed-fixture/stable.json
            dist/desktop-feed-fixture/nightly.json
          if-no-files-found: error
          retention-days: 7
