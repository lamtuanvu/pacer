name: Desktop (unsigned macOS and Linux)
on:
  workflow_dispatch:
    inputs:
      own_cert_order_control:
        description: Compare own-fixture codesign option order and selectors without trust changes
        type: boolean
        default: false
      controls_only:
        description: Skip normal builds only when the option-order experiment is explicitly selected
        type: boolean
        default: false
      own_cert_trust_control:
        description: Run reversible own-certificate trust experiment on disposable hosted macOS
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    if: ${{ !(inputs.controls_only == true && inputs.own_cert_order_control == true) }}
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Install pinned Rust toolchain
        working-directory: desktop/src-tauri
        run: |
          rustup show active-toolchain
          echo "RUSTUP_TOOLCHAIN=$(rustup show active-toolchain | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
      - name: Install root dependencies
        working-directory: .
        run: bun install --frozen-lockfile
      - name: Install desktop CLI
        run: bun install --frozen-lockfile
      - name: Install pacer CLI dependencies
        working-directory: .
        run: bun install --frozen-lockfile
      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked --manifest-path src-tauri/Cargo.toml
      - name: Stage bundled pacer CLI
        run: ./scripts/stage-cli.sh
      - name: Test offline
        run: cargo test --offline --locked --manifest-path src-tauri/Cargo.toml -- --include-ignored
      - name: Build unsigned app offline
        env:
          CARGO_NET_OFFLINE: 'true'
        run: bunx --no-install tauri build --bundles app --no-sign
      - name: Build update helper offline
        run: cargo build --offline --locked --release --manifest-path src-tauri/Cargo.toml --bin pacer-update-helper
      - name: Stage complete unsigned package
        working-directory: .
        run: |
          bun run release --host
          VERSION=$(bun -p 'require("./package.json").version')
          RELEASE_DIR="dist/release/$VERSION"
          cp -R desktop/src-tauri/target/release/bundle/macos/pacer.app "$RELEASE_DIR/pacer.app"
          cp desktop/src-tauri/target/release/pacer-update-helper "$RELEASE_DIR/pacer-update-helper"
          ARCH=$(uname -m)
          if [ "$ARCH" = arm64 ]; then ARCH=aarch64; fi
          STAGE=$(bun scripts/release/desktop.ts "$RELEASE_DIR" "$ARCH")
          echo "STAGED_APP=$STAGE/pacer.app" >> "$GITHUB_ENV"
      - name: Archive complete app preserving bundle metadata
        run: ditto -c -k --sequesterRsrc --keepParent "$STAGED_APP" pacer-macos-unsigned.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pacer-macos-unsigned
          path: desktop/pacer-macos-unsigned.zip
          retention-days: 7

  build-linux:
    if: ${{ !(inputs.controls_only == true && inputs.own_cert_order_control == true) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libssl-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf squashfs-tools
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Install pinned Rust toolchain
        working-directory: desktop/src-tauri
        run: |
          rustup show active-toolchain
          echo "RUSTUP_TOOLCHAIN=$(rustup show active-toolchain | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
      - name: Install desktop CLI
        run: bun install --frozen-lockfile
      - name: Install pacer CLI dependencies
        working-directory: .
        run: bun install --frozen-lockfile
      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked --manifest-path src-tauri/Cargo.toml
      - name: Stage bundled pacer CLI
        run: ./scripts/stage-cli.sh
      - name: Test offline
        run: cargo test --offline --locked --manifest-path src-tauri/Cargo.toml -- --include-ignored
      - name: Build unsigned Linux bundles
        env:
          CARGO_NET_OFFLINE: 'true'
        # The AppImage is repacked so linuxdeploy never rewrites the CLI (#217).
        run: ./scripts/build-linux-bundles.sh ../dist/pacer
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pacer-linux-${{ matrix.arch }}-unsigned
          path: |
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 7

  own-cert-trust-control:
    if: inputs.own_cert_trust_control == true
    runs-on: macos-15
    timeout-minutes: 10
    env:
      PACER_OWN_CERT_TRUST_CONTROL: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test control lifecycle with all subprocesses mocked
        run: python3 test/fixtures/selfsigner-trust-control-test.py
      - name: Compare original, own-policy-trusted, and trust-removed signing
        run: python3 test/fixtures/selfsigner-trust-control.py
      - name: Confirm exact own trust and keychain cleanup
        if: always()
        run: python3 test/fixtures/selfsigner-trust-control.py --cleanup
      - name: Retain public-only control receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: own-cert-trust-control-receipts
          path: ${{ runner.temp }}/pacer-own-cert-trust-control/*.json
          if-no-files-found: error
          retention-days: 7

  own-cert-order-control:
    if: inputs.own_cert_order_control == true
    runs-on: macos-15
    timeout-minutes: 10
    env:
      PACER_OWN_CERT_ORDER_CONTROL: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check own-identity integration guards with mocked commands
        run: python3 test/fixtures/selfsigner-own-identity-test.py
      - run: python3 test/fixtures/selfsigner-order-control.py
      - if: always()
        run: python3 test/fixtures/selfsigner-order-control.py --cleanup
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: own-cert-order-control-receipts
          path: ${{ runner.temp }}/pacer-own-cert-order-control/*.json
          if-no-files-found: error
          retention-days: 7
