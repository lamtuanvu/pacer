# One-off hosted LOWER-BOUND build benchmark. Not a release and not a 30-minute
# release result: it never runs Prepare PR, merge, tag, signing or publication.
# It runs only on a push to this exact temporary branch, which must never merge.
# No dispatch, schedule, PR, tag or workflow_run trigger; no secrets or caches.
name: Release build lower-bound benchmark (not a release)
on:
  push:
    branches:
      - benchmark/release-build-lower-bound
permissions:
  contents: read
  actions: read
# No concurrency cancellation: every trial and its queue time must remain observable.
jobs:
  candidate:
    name: candidate
    if: ${{ github.repository == 'lamtuanvu/pacer' && github.event_name == 'push' && github.ref == 'refs/heads/benchmark/release-build-lower-bound' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.identity.outputs.version }}
      sha: ${{ steps.identity.outputs.sha }}
      digest: ${{ steps.identity.outputs.digest }}
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
          no-cache: true
      - name: Capture push run t0 and immutable event identity
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/release/experiment.ts candidate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: upload
        with:
          name: candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate/candidate.json
          if-no-files-found: error
          retention-days: 7

  focused:
    name: focused
    if: ${{ github.repository == 'lamtuanvu/pacer' && github.event_name == 'push' && github.ref == 'refs/heads/benchmark/release-build-lower-bound' }}
    needs: [candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
          no-cache: true
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Focused release validation
        run: >-
          bun run test test/release-experiment-identity.test.ts
          test/release-experiment-benchmark.test.ts test/release-experiment.test.ts
          test/release-experiment-workflow.test.ts test/release-experiment-artifacts.test.ts
          test/release-pair-build.test.ts
          test/release-pair-packages.test.ts test/release-pair-orchestration.test.ts
          test/desktop-release-build.test.ts test/desktop-release-workflow.test.ts
          test/release-workflow.test.ts
      - name: Typecheck
        run: bun run typecheck

  cli-darwin-arm64:
    name: cli-darwin-arm64
    if: ${{ github.repository == 'lamtuanvu/pacer' && github.event_name == 'push' && github.ref == 'refs/heads/benchmark/release-build-lower-bound' }}
    needs: [candidate]
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
    env:
      CANDIDATE_DIGEST: ${{ needs.candidate.outputs.digest }}
      # artifact-ids downloads nest each artifact under <path>/<artifact name>/.
      CANDIDATE_PATH: candidate/candidate-${{ github.run_id }}-${{ github.run_attempt }}/candidate.json
      VERSION: ${{ needs.candidate.outputs.version }}
      PLATFORM: darwin-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
          no-cache: true
      - name: Download immutable candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.candidate.outputs.artifact }}
          merge-multiple: false
          path: candidate
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Install exact Rust release target
        run: |
          rustup show active-toolchain
          rustup target add aarch64-apple-darwin
      - name: Refuse a configured signing identity
        run: |
          identities=$(security find-identity -v -p codesigning)
          if printf '%s' "$identities" | grep -q 'pacer local code signing'; then exit 1; fi
      - name: Build exact native release pair
        run: bun scripts/release/build.ts --targets "$PLATFORM"
      - name: Seal identity and smoke native artifacts
        run: bun scripts/release/experiment.ts prepare-cli "cli-$PLATFORM" "out/cli-$PLATFORM"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: upload
        with:
          name: cli-darwin-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/cli-darwin-arm64/
          if-no-files-found: error
          retention-days: 7

  desktop-darwin-arm64:
    name: desktop-darwin-arm64
    if: ${{ github.repository == 'lamtuanvu/pacer' && github.event_name == 'push' && github.ref == 'refs/heads/benchmark/release-build-lower-bound' }}
    needs: [candidate, cli-darwin-arm64]
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CANDIDATE_DIGEST: ${{ needs.candidate.outputs.digest }}
      # artifact-ids downloads nest each artifact under <path>/<artifact name>/.
      CANDIDATE_PATH: candidate/candidate-${{ github.run_id }}-${{ github.run_attempt }}/candidate.json
      VERSION: ${{ needs.candidate.outputs.version }}
      PLATFORM: darwin-arm64
      SOURCE: source/cli-darwin-arm64-${{ github.run_id }}-${{ github.run_attempt }}
      TARGET: aarch64-apple-darwin
      BUNDLES: app
      ARCH: aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
          no-cache: true
      - name: Download immutable candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.candidate.outputs.artifact }}
          merge-multiple: false
          path: candidate
      - name: Download matching CLI handoff
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.cli-darwin-arm64.outputs.artifact }}
          merge-multiple: false
          path: source
      - name: Check producer identity and digest; smoke received pair
        run: bun scripts/release/experiment.ts verify "cli-$PLATFORM" "$SOURCE"
      - name: Install locked root and desktop dependencies
        run: |
          bun install --frozen-lockfile
          bun install --frozen-lockfile --cwd desktop
      - name: Install exact desktop Rust toolchain and fetch locked dependencies
        working-directory: desktop/src-tauri
        run: |
          rustup show active-toolchain
          echo "RUSTUP_TOOLCHAIN=$(rustup show active-toolchain | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
          rustup target add "$TARGET"
          cargo fetch --locked --target "$TARGET"
      - name: Stage verified native CLI pair
        env:
          TAURI_TARGET_TRIPLE: ${{ env.TARGET }}
        run: desktop/scripts/stage-cli.sh "$SOURCE/pacer-$PLATFORM"
      - name: Build unsigned app and update helper
        working-directory: desktop
        env:
          CARGO_NET_OFFLINE: 'true'
        run: |
          bunx --no-install tauri build --target "$TARGET" --bundles "$BUNDLES" --no-sign
          cargo build --offline --locked --release --target "$TARGET" --manifest-path src-tauri/Cargo.toml --bin pacer-update-helper
      - name: Stage and archive complete unsigned app
        run: |
          mkdir -p "dist/release/$VERSION" "out/desktop-$PLATFORM"
          cp "$SOURCE"/pacer-* "$SOURCE/manifest.json" "$SOURCE/SHA256SUMS" "dist/release/$VERSION/"
          cp -R "desktop/src-tauri/target/$TARGET/release/bundle/macos/pacer.app" "dist/release/$VERSION/pacer.app"
          cp "desktop/src-tauri/target/$TARGET/release/pacer-update-helper" "dist/release/$VERSION/pacer-update-helper"
          stage=$(bun scripts/release/desktop.ts "dist/release/$VERSION" "$ARCH")
          ditto -c -k --sequesterRsrc --keepParent "$stage/pacer.app" "out/desktop-$PLATFORM/pacer-$VERSION-$PLATFORM-unsigned.zip"
      - name: Seal desktop source handoff and smoke extracted artifacts
        run: |
          bun scripts/release/experiment.ts seal "desktop-$PLATFORM" "out/desktop-$PLATFORM" "$SOURCE"
          bun scripts/release/experiment.ts smoke-desktop "desktop-$PLATFORM" "out/desktop-$PLATFORM" "$SOURCE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-darwin-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/desktop-darwin-arm64/
          if-no-files-found: error
          retention-days: 7

