          if-no-files-found: error
          retention-days: 7

  desktop-linux-arm64:
    name: desktop-linux-arm64
    if: ${{ github.repository == 'lamtuanvu/pacer' && github.event_name == 'push' && github.ref == 'refs/heads/benchmark/release-build-lower-bound' }}
    needs: [candidate, cli-linux-arm64]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      CANDIDATE_DIGEST: ${{ needs.candidate.outputs.digest }}
      # artifact-ids downloads nest each artifact under <path>/<artifact name>/.
      CANDIDATE_PATH: candidate/candidate-${{ github.run_id }}-${{ github.run_attempt }}/candidate.json
      VERSION: ${{ needs.candidate.outputs.version }}
      PLATFORM: linux-arm64
      SOURCE: source/cli-linux-arm64-${{ github.run_id }}-${{ github.run_attempt }}
      TARGET: aarch64-unknown-linux-gnu
      BUNDLES: appimage,deb
      ARCH: aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
          no-cache: true
      - name: Download immutable candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.candidate.outputs.artifact }}
          merge-multiple: false
          path: candidate
      - name: Download matching CLI handoff
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.cli-linux-arm64.outputs.artifact }}
          merge-multiple: false
          path: source
      - name: Check producer identity and digest; smoke received pair
        run: bun scripts/release/experiment.ts verify "cli-$PLATFORM" "$SOURCE"
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libssl-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf squashfs-tools
      - name: Install locked root and desktop dependencies
        run: |
          bun install --frozen-lockfile
          bun install --frozen-lockfile --cwd desktop
      - name: Install exact desktop Rust toolchain and fetch locked dependencies
        working-directory: desktop/src-tauri
        run: |
          rustup show active-toolchain
          echo "RUSTUP_TOOLCHAIN=$(rustup show active-toolchain | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
          rustup target add "$TARGET"
          cargo fetch --locked --target "$TARGET"
      - name: Stage verified native CLI pair
        env:
          TAURI_TARGET_TRIPLE: ${{ env.TARGET }}
        run: desktop/scripts/stage-cli.sh "$SOURCE/pacer-$PLATFORM"
      - name: Build unsigned AppImage and deb with the verified pair
        env:
          CARGO_NET_OFFLINE: 'true'
        run: desktop/scripts/build-linux-bundles.sh "$SOURCE/pacer-$PLATFORM" "$VERSION" "$TARGET"
      - name: Collect exact Linux bundles
        run: |
          bundle="desktop/src-tauri/target/$TARGET/release/bundle"
          mkdir -p "out/desktop-$PLATFORM"
          cp "$bundle"/appimage/*.AppImage "out/desktop-$PLATFORM/pacer-$VERSION-$PLATFORM-unsigned.AppImage"
          cp "$bundle"/deb/*.deb "out/desktop-$PLATFORM/pacer-$VERSION-$PLATFORM-unsigned.deb"
      - name: Seal desktop source handoff and smoke extracted artifacts
        run: |
          bun scripts/release/experiment.ts seal "desktop-$PLATFORM" "out/desktop-$PLATFORM" "$SOURCE"
          bun scripts/release/experiment.ts smoke-desktop "desktop-$PLATFORM" "out/desktop-$PLATFORM" "$SOURCE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-linux-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/desktop-linux-arm64/
          if-no-files-found: error
          retention-days: 7

  promotion:
    name: promotion
    if: ${{ github.repository == 'lamtuanvu/pacer' && github.event_name == 'push' && github.ref == 'refs/heads/benchmark/release-build-lower-bound' }}
    needs: [candidate, focused, cli-darwin-arm64, desktop-darwin-arm64, cli-darwin-x64, desktop-darwin-x64, cli-linux-x64, desktop-linux-x64, cli-linux-arm64, desktop-linux-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CANDIDATE_DIGEST: ${{ needs.candidate.outputs.digest }}
      # artifact-ids downloads nest each artifact under <path>/<artifact name>/.
      CANDIDATE_PATH: candidate/candidate-${{ github.run_id }}-${{ github.run_attempt }}/candidate.json
      VERSION: ${{ needs.candidate.outputs.version }}
      NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
          no-cache: true
      - name: Download immutable candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.candidate.outputs.artifact }}
          merge-multiple: false
          path: candidate
      - name: Download cli-darwin-arm64
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cli-darwin-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: handoffs/cli-darwin-arm64
      - name: Download desktop-darwin-arm64
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: desktop-darwin-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: handoffs/desktop-darwin-arm64
      - name: Download cli-darwin-x64
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cli-darwin-x64-${{ github.run_id }}-${{ github.run_attempt }}
          path: handoffs/cli-darwin-x64
      - name: Download desktop-darwin-x64
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: desktop-darwin-x64-${{ github.run_id }}-${{ github.run_attempt }}
          path: handoffs/desktop-darwin-x64
      - name: Download cli-linux-x64
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cli-linux-x64-${{ github.run_id }}-${{ github.run_attempt }}
          path: handoffs/cli-linux-x64
      - name: Download desktop-linux-x64
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: desktop-linux-x64-${{ github.run_id }}-${{ github.run_attempt }}
          path: handoffs/desktop-linux-x64
      - name: Download cli-linux-arm64
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cli-linux-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: handoffs/cli-linux-arm64
      - name: Download desktop-linux-arm64
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: desktop-linux-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: handoffs/desktop-linux-arm64
      - name: Simulate promotion with no external writes
        run: bun scripts/release/experiment.ts promote
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: promotion-simulation-${{ github.run_id }}-${{ github.run_attempt }}
          path: simulation/
          if-no-files-found: error
          retention-days: 7

  report:
    name: report
    if: ${{ always() && github.repository == 'lamtuanvu/pacer' && github.event_name == 'push' && github.ref == 'refs/heads/benchmark/release-build-lower-bound' }}
    needs: [candidate, focused, cli-darwin-arm64, desktop-darwin-arm64, cli-darwin-x64, desktop-darwin-x64, cli-linux-x64, desktop-linux-x64, cli-linux-arm64, desktop-linux-arm64, promotion]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
          no-cache: true
      - name: Report lower-bound elapsed, queue, setup and stage timestamps
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/release/experiment.ts report
      - name: Retain measured report even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: benchmark/
          if-no-files-found: error
          retention-days: 7
