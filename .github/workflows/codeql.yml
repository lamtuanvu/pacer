name: CodeQL

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 3 * * 1'

permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  changes:
    name: Select affected checks
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      codeql: ${{ steps.changes.outputs.codeql }}
    steps:
      - name: Check out history for complete change detection
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select checks from changed paths
        id: changes
        run: python3 scripts/ci/changes.py

  analyze:
    needs: changes
    name: Analyze JavaScript and TypeScript
    # Code scanning and Scorecard need a public repo on a free account.
    if: ${{ always() && !github.event.repository.private && (needs.changes.result != 'success' || needs.changes.outputs.codeql == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: javascript-typescript
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
