[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
exclude = ["desktop/src-tauri"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/lamtuanvu/pacer"
rust-version = "1.99"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio-util = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "process", "time", "sync", "net", "signal", "fs"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.dev]
debug = "line-tables-only"
incremental = true
split-debuginfo = "unpacked"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
