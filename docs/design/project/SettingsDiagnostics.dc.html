<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Diagnostics</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/pacer/tokens.css">
<link rel="stylesheet" href="ds/pacer/components/bundle.css">
<script src="ds/pacer/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:var(--surface-page)}
a{color:var(--link)}a:hover{color:var(--ink)}
.lbl{font-size:11px;line-height:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted)}
.cap{font-size:12px;line-height:16px;color:var(--ink-muted)}
.mono{font-family:var(--font-mono);font-size:12px}
</style>
</helmet>
<div style="display: flex; flex-direction: column; min-height: 100vh; background: var(--surface-page); color: var(--ink); font-family: var(--font-sans); font-size: 13px; line-height: 19px; font-variant-numeric: tabular-nums;">
<dc-import name="TopBar" hint-size="100%,44px"></dc-import>
<div style="flex-grow: 1; display: flex; min-height: 0;">
<dc-import name="ActivityBar" active="settings" hint-size="52px,100%"></dc-import>
<dc-import name="SettingsNav" active="diagnostics" hint-size="240px,900px"></dc-import>
<main style="flex: 999 1 560px; min-width: 0; padding: 24px 32px 40px; display: flex; flex-direction: column; gap: 18px; box-sizing: border-box;">
<header style="display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap;">
<div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1;"><h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 650;">Diagnostics</h1><span class="cap">Checks that pacer, your planner and every executor are wired up. Last run today 10:41 · took 38s.</span></div>
<x-import component-from-global-scope="Pacer.Button" size="sm">Copy report</x-import>
<x-import component-from-global-scope="Pacer.Button" size="sm" variant="primary">Run all checks</x-import>
</header>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;">
<sc-for list="{{totals}}" as="t" hint-placeholder-count="4"><div style="padding: 12px 16px; border-right: 1px solid var(--line); margin-right: -1px; display: flex; align-items: center; gap: 10px;"><span aria-hidden="true" style="width: 26px; height: 26px; border-radius: 99px; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; background: {{t.bg}}; color: {{t.fg}};">{{t.glyph}}</span><span style="display: flex; flex-direction: column;"><b style="font-size: 16px; line-height: 22px;">{{t.n}}</b><span class="cap">{{t.label}}</span></span></div></sc-for>
</div>

<sc-for list="{{groups}}" as="g" hint-placeholder-count="5">
<section aria-label="{{g.name}}" style="display: flex; flex-direction: column; gap: 6px;">
<h2 class="lbl" style="margin: 0;">{{g.name}}</h2>
<div style="border: 1px solid var(--line); border-radius: 12px; overflow: hidden;">
<sc-for list="{{g.rows}}" as="r" hint-placeholder-count="3">
<details style="border-top: 1px solid var(--surface-lane); background: {{r.bg}};" open="{{r.open}}">
<summary style="list-style: none; cursor: pointer; display: grid; grid-template-columns: 22px minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 10px 14px;">
<span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 99px; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; background: {{r.gbg}}; color: {{r.gfg}};">{{r.glyph}}</span>
<span style="display: flex; flex-direction: column; min-width: 0;"><b>{{r.title}}</b><span class="cap">{{r.detail}}</span></span>
<sc-if value="{{r.action}}" hint-placeholder-val="{{ false }}"><x-import component-from-global-scope="Pacer.Button" size="sm">{{r.action}}</x-import></sc-if>
<span class="cap">{{r.time}}</span>
</summary>
<sc-if value="{{r.out}}" hint-placeholder-val="{{ false }}"><pre class="mono" style="margin: 0; padding: 8px 14px 12px 48px; color: var(--ink-secondary); white-space: pre-wrap;">{{r.out}}</pre></sc-if>
</details>
</sc-for>
</div>
</section>
</sc-for>
</main>
</div>
<dc-import name="StatusBar" hint-size="100%,28px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const ok = { glyph: '✓', gbg: 'var(--good-bg)', gfg: 'var(--good-fg)', bg: 'transparent', open: false, out: '', action: '' };
    const warn = { glyph: '!', gbg: 'var(--warn-bg)', gfg: 'var(--warn-fg)', bg: 'var(--warn-tint)', open: false, out: '' };
    const bad = { glyph: '✕', gbg: 'var(--bad-bg)', gfg: 'var(--bad-fg)', bg: 'var(--bad-tint)', open: true };
    return {
      totals: [
        { glyph: '✓', bg: 'var(--good-bg)', fg: 'var(--good-fg)', n: '14', label: 'Passed' },
        { glyph: '!', bg: 'var(--warn-bg)', fg: 'var(--warn-fg)', n: '2', label: 'Need a look' },
        { glyph: '✕', bg: 'var(--bad-bg)', fg: 'var(--bad-fg)', n: '1', label: 'Failed' },
        { glyph: '–', bg: 'var(--surface-lane)', fg: 'var(--ink-muted)', n: '2', label: 'Not checked' }
      ],
      groups: [
        { name: 'Planner · Claude Code', rows: [
          { ...ok, title: 'Hooks installed and seen firing', detail: 'Last hook call 10 min ago from a real session', time: '0.2s' },
          { ...ok, title: 'Status line reports usage', detail: 'Weekly 18% · 5h 4% · reading 10 min old', time: '0.1s' },
          { ...warn, title: 'MCP server registered, not used yet', detail: 'Configured correctly; no planner session has called it', action: 'How to use it', time: '0.1s' }
        ]},
        { name: 'Executors', rows: [
          { ...ok, title: 'Codex · test task passed', detail: 'Wrote and checked a file in a scratch worktree', time: '11.8s' },
          { ...ok, title: 'Antigravity · test task passed', detail: 'Requested model answered', time: '14.0s' },
          { ...bad, title: 'BytePlus · endpoint refused the request', detail: '402 Payment Required: no active coding-plan subscription', action: 'Add subscription', time: '1.3s', out: 'POST /v1/chat/completions → 402\nThe key is valid; the account has no active plan.' },
          { ...warn, title: 'Cursor · usage reading is stale', detail: 'Last reading 113h ago; the dispatcher skips Cursor until it refreshes', action: 'Refresh usage', time: '0.4s' }
        ]},
        { name: 'Service', rows: [
          { ...ok, title: 'pacer serve is running', detail: 'Version 0.11.0 · loopback only · authenticated', time: '0.0s' },
          { ...ok, title: 'Desktop app matches the service', detail: 'Both 0.11.0', time: '0.0s' }
        ]},
        { name: 'Plugins', rows: [
          { ...ok, title: 'Release checklist responds', detail: 'Protocol 1.2 · started in 120ms', time: '0.1s' },
          { ...ok, title: 'Cost estimates responds', detail: 'Protocol 1.1 · update available', time: '0.1s' }
        ]}
      ]
    };
  }
}
</script>
</body>
</html>
