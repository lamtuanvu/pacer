<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Loading</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/pacer/tokens.css">
<link rel="stylesheet" href="ds/pacer/components/bundle.css">
<script src="ds/pacer/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:var(--surface-page)}
.lbl{font-size:11px;line-height:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted)}
.cap{font-size:12px;line-height:16px;color:var(--ink-muted)}
.sk{display:block;border-radius:4px;background:var(--surface-lane);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
@media (prefers-reduced-motion: reduce){.sk{animation:none}}
</style>
</helmet>
<div style="display: flex; flex-direction: column; min-height: 100vh; background: var(--surface-page); color: var(--ink); font-family: var(--font-sans); font-size: 13px; line-height: 19px;">
<dc-import name="TopBar" hint-size="100%,36px"></dc-import>
<div style="flex-grow: 1; display: flex; min-height: 0;">
<dc-import name="ActivityBar" active="tasks" hint-size="52px,100%"></dc-import>
<main aria-busy="true" aria-label="Loading the task" style="flex: 999 1 560px; min-width: 0; padding: 24px 32px 40px; display: flex; flex-direction: column; gap: 20px; box-sizing: border-box;">

<span class="sk" style="width: 180px; height: 12px;"></span>
<header style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start;">
<div style="display: flex; flex-direction: column; gap: 10px; flex: 1 1 520px;">
<span class="sk" style="width: 46%; height: 28px; border-radius: 6px;"></span>
<span style="display: flex; gap: 6px;"><span class="sk" style="width: 96px; height: 20px; border-radius: 99px;"></span><span class="sk" style="width: 88px; height: 20px; border-radius: 99px;"></span><span class="sk" style="width: 220px; height: 16px; margin-top: 2px;"></span></span>
</div>
<span style="display: flex; gap: 8px;"><span class="sk" style="width: 120px; height: 32px; border-radius: 8px;"></span><span class="sk" style="width: 72px; height: 32px; border-radius: 8px;"></span><span class="sk" style="width: 112px; height: 32px; border-radius: 8px;"></span></span>
</header>

<section style="border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; display: flex; align-items: center; gap: 12px;"><span class="sk" style="width: 26px; height: 26px; border-radius: 99px;"></span><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px;"><span class="sk" style="width: 30%; height: 14px;"></span><span class="sk" style="width: 55%; height: 12px;"></span></span><span class="sk" style="width: 140px; height: 32px; border-radius: 8px;"></span></section>

<section style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;">
<sc-for list="{{four}}" as="k" hint-placeholder-count="4"><div style="padding: 14px 18px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px;"><span class="sk" style="width: 40%; height: 10px;"></span><span class="sk" style="width: 60%; height: 22px; border-radius: 6px;"></span><span class="sk" style="width: 80%; height: 10px;"></span></div></sc-for>
</section>

<div style="display: flex; gap: 20px; align-items: flex-start;">
<section style="flex: 999 1 520px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden;">
<div style="padding: 14px 20px; background: var(--surface-card); border-bottom: 1px solid var(--line);"><span class="sk" style="width: 140px; height: 16px;"></span></div>
<div style="padding: 16px 20px; display: flex; flex-direction: column; gap: 18px;">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="4"><div style="display: grid; grid-template-columns: 26px minmax(0, 1fr) 60px; gap: 12px; align-items: start;"><span class="sk" style="width: 26px; height: 26px; border-radius: 99px;"></span><span style="display: flex; flex-direction: column; gap: 6px;"><span class="sk" style="width: {{r.a}}; height: 13px;"></span><span class="sk" style="width: {{r.b}}; height: 11px;"></span></span><span class="sk" style="height: 11px;"></span></div></sc-for>
</div>
</section>
<aside style="flex: 1 1 340px; display: flex; flex-direction: column; gap: 20px;">
<sc-for list="{{cards}}" as="c" hint-placeholder-count="3"><section style="border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px;"><span class="sk" style="width: 45%; height: 16px;"></span><span class="sk" style="width: 100%; height: 12px;"></span><span class="sk" style="width: {{c.w}}; height: 12px;"></span></section></sc-for>
</aside>
</div>

<span class="cap" style="display: none;">Loading the task</span>
</main>
</div>
<dc-import name="StatusBar" hint-size="100%,28px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      four: [1, 2, 3, 4],
      rows: [{ a: '38%', b: '62%' }, { a: '30%', b: '48%' }, { a: '44%', b: '70%' }, { a: '26%', b: '40%' }],
      cards: [{ w: '70%' }, { w: '55%' }, { w: '80%' }]
    };
  }
}
</script>
</body>
</html>
