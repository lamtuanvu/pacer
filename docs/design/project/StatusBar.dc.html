<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Status bar</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/pacer/tokens.css">
<link rel="stylesheet" href="ds/pacer/components/bundle.css">
<script src="ds/pacer/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<footer style="height: 28px; width: 100%; box-sizing: border-box; display: flex; align-items: center; gap: 14px; padding: 0 10px; border-top: 1px solid var(--line); background: var(--surface-card); color: var(--ink); font-family: var(--font-sans); font-size: 12px; line-height: 16px; font-variant-numeric: tabular-nums;">
<sc-for list="{{budgets}}" as="b" hint-placeholder-count="5"><span style="display: inline-flex; align-items: center; gap: 5px;" title="{{b.title}}"><dc-import name="AgentMark" mono="{{b.mono}}" size="16" hint-size="16px,16px"></dc-import><span style="font-weight: 600;">{{b.pct}}</span><span aria-hidden="true" style="width: 28px; height: 4px; border-radius: 4px; background: var(--surface-lane); overflow: hidden;"><span style="display: block; height: 100%; width: {{b.w}}%; background: {{b.fill}};"></span></span><sc-if value="{{b.warn}}" hint-placeholder-val="{{ false }}"><span style="color: {{b.wfg}}; font-weight: 700;" aria-label="{{b.warn}}">!</span></sc-if></span></sc-for>
<span style="flex-grow: 1;"></span>
<a href="Tasks.dc.html" style="display: inline-flex; align-items: center; gap: 6px; color: var(--ink-secondary); text-decoration: none;"><span aria-hidden="true" style="width: 7px; height: 7px; border-radius: 99px; background: var(--info-fg);"></span>1 running · 0 queued</a>
<a href="Shell.dc.html" style="display: inline-flex; align-items: center; gap: 4px; color: var(--ink-secondary); text-decoration: none;"><svg viewBox="0 0 24 24" aria-hidden="true" style="width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round;"><path d="M7 9l3 3-3 3"></path><path d="M13 15h4"></path></svg>Terminal <span style="font-family: var(--font-mono); font-size: 11px; color: var(--ink-muted);">Ctrl+`</span></a>
<span style="color: var(--ink-muted);">? shortcuts</span>
<span style="color: var(--ink-muted);">pacer 0.11.0</span>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":40}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      budgets: [
        { mono: 'Cl', pct: '16%', w: 16, fill: 'var(--good-fill)', title: 'Claude Code · 16% of week · under pace' },
        { mono: 'Cx', pct: '81%', w: 81, fill: 'var(--warn-fill)', warn: 'Ahead of pace', wfg: 'var(--warn-fg)', title: 'Codex · 81% of week · ahead of pace' },
        { mono: 'Ag', pct: '22%', w: 22, fill: 'var(--good-fill)', title: 'Antigravity · 22%' },
        { mono: 'Cu', pct: '100%', w: 100, fill: 'var(--line)', warn: 'Stale reading', wfg: 'var(--warn-fg)', title: 'Cursor · reading 113h old' },
        { mono: 'BP', pct: '45%', w: 45, fill: 'var(--line)', warn: 'No subscription', wfg: 'var(--bad-fg)', title: 'BytePlus · no active subscription' }
      ]
    };
  }
}
</script>
</body>
</html>
