<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Title bar</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/pacer/tokens.css">
<link rel="stylesheet" href="ds/pacer/components/bundle.css">
<script src="ds/pacer/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.tb-ib{width:28px;height:28px;border:0;border-radius:6px;background:transparent;color:var(--ink-secondary);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.tb-ib:hover{background:var(--surface-lane);color:var(--ink)}
</style>
</helmet>
<header style="height: 36px; width: 100%; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 10px 0 84px; border-bottom: 1px solid var(--line); background: var(--surface-card); color: var(--ink); font-family: var(--font-sans); font-size: 13px; line-height: 19px;">
<x-import component-from-global-scope="Pacer.Mark" size="{{n18}}"></x-import>
<span style="flex-grow: 1;"></span>
<a href="CommandMenu.dc.html" aria-keyshortcuts="Meta+K" style="text-decoration: none; box-sizing: border-box; display: flex; align-items: center; gap: 8px; width: 420px; max-width: 40vw; height: 26px; padding: 0 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-page); color: var(--ink-muted); font: inherit;">
<svg viewBox="0 0 24 24" aria-hidden="true" style="width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round;"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<span style="flex-grow: 1; text-align: left;">Search tasks, agents or run a command</span>
<span style="font-family: var(--font-mono); font-size: 11px; padding: 0 5px; border: 1px solid var(--line); border-radius: 4px;">⌘K</span>
</a>
<span style="flex-grow: 1;"></span>
<a href="SettingsBudget.dc.html" title="Planner budget" style="text-decoration: none; color: var(--ink); display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px 0 3px; border: 1px solid var(--line); border-radius: 99px;"><dc-import name="AgentMark" mono="Cl" size="18" hint-size="18px,18px"></dc-import><span style="font-weight: 600;">Claude Code</span><x-import component-from-global-scope="Pacer.Pill" tone="good">Relaxed</x-import></a>
<div role="group" aria-label="Layout" style="display: flex; gap: 2px; padding: 0 4px; border-left: 1px solid var(--line); border-right: 1px solid var(--line); margin: 0 4px;">
<button class="tb-ib" type="button" aria-label="Toggle left panel"><svg viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round;"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M9 4v16"></path></svg></button>
<button class="tb-ib" type="button" aria-label="Toggle terminal panel (Ctrl+`)"><svg viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round;"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M3 14h18"></path></svg></button>
<button class="tb-ib" type="button" aria-label="Toggle right panel"><svg viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round;"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M15 4v16"></path></svg></button>
</div>
<a href="NewTask.dc.html" aria-keyshortcuts="Meta+N" style="display: inline-flex; align-items: center; height: 26px; padding: 0 10px; box-sizing: border-box; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-page); color: var(--ink); font-size: 12px; font-weight: 600; text-decoration: none;">New task</a>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":36}}'>
class Component extends DCLogic {
  renderVals() { return { n18: 18 }; }
}
</script>
</body>
</html>
