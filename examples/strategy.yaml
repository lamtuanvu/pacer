# pacer starter strategy. Copy to ~/.pacer/strategy.yaml and edit.
planner: claude-code

providers:
  claude-code: { usage: quota }
  codex:       { usage: quota, allow_paid: false }   # never spend Codex credits
  cursor:      { usage: reactive, cooldown: 6h }
  agy:         { usage: reactive, cooldown: 6h }
  byteplus:    { via: opencode, model: coding-plan/dola-seed-2.0-code, usage: quota, quota_source: arkcli }
  local:       { via: opencode, model: lmstudio/qwen3.6-35b-a3b, usage: unmetered }

pacing:
  policy: priority
  order: [codex, cursor, agy, opencode]
  planner_reserve: 15

routing:
  - default: [codex, cursor, agy, byteplus, local]
